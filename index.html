<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flurbreaker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101317;
      --panel: #1b222b;
      --panel-2: #242d38;
      --text: #f5efe6;
      --muted: #b7afa3;
      --line: #3a4654;
      --gold: #dfb85b;
      --green: #83c27d;
      --blue: #86acd9;
      --rose: #d67f7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(223, 184, 91, 0.14), transparent 34%),
        linear-gradient(225deg, rgba(134, 172, 217, 0.13), transparent 38%),
        linear-gradient(0deg, rgba(131, 194, 125, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .shell {
      width: min(1120px, calc(100vw - 28px));
      display: grid;
      grid-template-columns: minmax(0, 800px) 280px;
      gap: 16px;
      align-items: start;
    }

    main,
    aside {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 34, 43, 0.94);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
    }

    main {
      padding: 14px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding: 4px 2px 12px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
    }

    .subtitle,
    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .score {
      min-width: 150px;
      text-align: right;
      color: var(--gold);
      font-weight: 700;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111820;
    }

    aside {
      padding: 16px;
    }

    section + section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 10px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      min-height: 42px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--gold);
    }

    .message {
      min-height: 48px;
      color: var(--muted);
      line-height: 1.45;
    }

    @media (max-width: 920px) {
      body {
        display: block;
        padding: 14px 0;
      }

      .shell {
        grid-template-columns: 1fr;
        width: min(800px, calc(100vw - 24px));
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <header>
        <div>
          <h1>Flurbreaker</h1>
          <div class="subtitle">Guide Flurb through asteroid space.</div>
        </div>
        <div class="score" id="scoreLabel">0 pts</div>
      </header>
      <canvas id="game" width="800" height="500" aria-label="Flurbreaker brick breaker game"></canvas>
    </main>

    <aside>
      <section>
        <h2>Status</h2>
        <div class="stat-grid">
          <div class="stat"><strong id="stageLabel">1</strong><span>Stage</span></div>
          <div class="stat"><strong id="livesLabel">3</strong><span>Lives</span></div>
          <div class="stat"><strong id="bricksLabel">0</strong><span>Bricks</span></div>
          <div class="stat"><strong id="comboLabel">x1</strong><span>Combo</span></div>
        </div>
      </section>

      <section>
        <h2>Controls</h2>
        <div class="controls">
          <span>Move: WASD, currently A/D</span>
          <span>Launch: Space</span>
          <span>Pause: P</span>
          <span>Restart: R</span>
        </div>
        <button id="startButton" type="button">Launch Ball</button>
        <button id="restartButton" type="button">Restart Game</button>
      </section>

      <section>
        <h2>Console</h2>
        <div class="message" id="message">Press Space to launch. A/D to move.</div>
      </section>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreLabel = document.getElementById("scoreLabel");
    const stageLabel = document.getElementById("stageLabel");
    const livesLabel = document.getElementById("livesLabel");
    const bricksLabel = document.getElementById("bricksLabel");
    const comboLabel = document.getElementById("comboLabel");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const restartButton = document.getElementById("restartButton");

    const colors = ["#dfb85b", "#83c27d", "#86acd9", "#d67f7a", "#b58ce0"];
    const keys = new Set();
    const stages = [
      {
        name: "Warm Boot",
        ballSpeed: 270,
        paddleWidth: 120,
        asteroidEvery: 1.55,
        asteroidSpeed: 185,
        layout: [
          "..........",
          "..111111..",
          ".12222221.",
          "..111111.."
        ]
      },
      {
        name: "Pixel Gate",
        ballSpeed: 302,
        paddleWidth: 112,
        asteroidEvery: 1.3,
        asteroidSpeed: 220,
        layout: [
          "11..22..11",
          ".13333331.",
          "..222222..",
          ".13333331.",
          "11..22..11"
        ]
      },
      {
        name: "Neon Stack",
        ballSpeed: 334,
        paddleWidth: 104,
        asteroidEvery: 1.08,
        asteroidSpeed: 255,
        layout: [
          "4444444444",
          ".333..333.",
          "..222222..",
          ".333..333.",
          "1111111111",
          "..2.44.2.."
        ]
      }
    ];

    const resources = {
      water: { label: "Water", short: "H2O", color: "#63e6ff" },
      iron: { label: "Iron", short: "Fe", color: "#c2cad4" },
      platinum: { label: "Platinum", short: "Pt", color: "#e8dcff" }
    };

    const resourceTypes = Object.keys(resources);
    const starLayers = [
      { speed: 16, size: 1, alpha: 0.42, stars: makeStars(60, 11) },
      { speed: 34, size: 1.6, alpha: 0.62, stars: makeStars(38, 29) },
      { speed: 62, size: 2.3, alpha: 0.88, stars: makeStars(22, 47) }
    ];

    const state = {
      stageIndex: 0,
      score: 0,
      lives: 3,
      combo: 1,
      running: true,
      launched: false,
      paused: false,
      gameOver: false,
      won: false,
      paddle: { x: 340, y: 456, w: 120, h: 14, speed: 560 },
      ball: { x: 400, y: 434, r: 8, vx: 230, vy: -260 },
      bricks: [],
      particles: [],
      powerups: [],
      asteroids: [],
      resources: { water: 0, iron: 0, platinum: 0 },
      asteroidTimer: 0,
      starTime: 0,
      blob: { x: 706, y: 386, scale: 5 }
    };

    const blobPoses = [
      [
        "000111000",
        "001333100",
        "013333310",
        "133232331",
        "133333331",
        "013333310",
        "001111100"
      ],
      [
        "000111100",
        "001333310",
        "013333331",
        "133223331",
        "133333310",
        "011333100",
        "000111000"
      ],
      [
        "001111000",
        "013333100",
        "133333310",
        "133322331",
        "013333331",
        "001333100",
        "000111000"
      ]
    ];

    function seededNoise(seed) {
      const value = Math.sin(seed * 999.97) * 10000;
      return value - Math.floor(value);
    }

    function makeStars(count, offset) {
      const stars = [];
      for (let i = 0; i < count; i += 1) {
        stars.push({
          x: seededNoise(i + offset) * canvas.width,
          y: seededNoise(i * 2 + offset) * canvas.height
        });
      }
      return stars;
    }

    function resetBall() {
      state.launched = false;
      state.combo = 1;
      state.ball.x = state.paddle.x + state.paddle.w / 2;
      state.ball.y = state.paddle.y - 18;
      const stage = currentStage();
      const speed = stage.ballSpeed;
      state.ball.vx = (Math.random() > 0.5 ? 1 : -1) * (150 + state.stageIndex * 28);
      state.ball.vy = -speed;
      setMessage("Ball ready. Launch when you are.");
    }

    function currentStage() {
      return stages[state.stageIndex];
    }

    function makeStage(stageIndex) {
      state.bricks = [];
      state.powerups = [];
      state.particles = [];
      state.asteroids = [];
      state.asteroidTimer = 0.65;
      const stage = stages[stageIndex];
      const cols = 10;
      const gap = 8;
      const brickW = (canvas.width - 80 - gap * (cols - 1)) / cols;
      const brickH = 24;
      state.paddle.w = stage.paddleWidth;
      state.paddle.x = canvas.width / 2 - state.paddle.w / 2;

      for (let row = 0; row < stage.layout.length; row += 1) {
        const line = stage.layout[row].padEnd(cols, ".");
        for (let col = 0; col < cols; col += 1) {
          const cell = line[col];
          if (cell === ".") continue;
          const hp = Number(cell);
          state.bricks.push({
            x: 40 + col * (brickW + gap),
            y: 58 + row * (brickH + gap),
            w: brickW,
            h: brickH,
            hp,
            maxHp: hp,
            color: colors[(hp + row + col) % colors.length]
          });
        }
      }
      resetBall();
      updateUi();
    }

    function setMessage(text) {
      message.textContent = text;
    }

    function launch() {
      if (state.gameOver || state.won) return;
      if (state.paused) {
        state.paused = false;
        setMessage("Back in motion.");
      }
      if (!state.launched) {
        state.launched = true;
        setMessage("Clear the board.");
      }
    }

    function restartGame() {
      state.stageIndex = 0;
      state.score = 0;
      state.lives = 3;
      state.combo = 1;
      state.resources = { water: 0, iron: 0, platinum: 0 };
      state.asteroids = [];
      state.asteroidTimer = 0;
      state.starTime = 0;
      state.gameOver = false;
      state.won = false;
      state.paused = false;
      makeStage(0);
      setMessage("Fresh board. Press Space to launch.");
    }

    function nextStage() {
      state.stageIndex += 1;
      if (state.stageIndex >= stages.length) {
        state.won = true;
        state.launched = false;
        setMessage("You cleared every stage. Flurb has a clear route through space.");
        updateUi();
        return;
      }
      makeStage(state.stageIndex);
      setMessage(`Stage ${state.stageIndex + 1}: ${currentStage().name}.`);
    }

    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 70 + Math.random() * 160;
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.45 + Math.random() * 0.35,
          color
        });
      }
    }

    function maybePowerup(x, y) {
      if (Math.random() > 0.12) return;
      state.powerups.push({
        x,
        y,
        w: 22,
        h: 16,
        vy: 105,
        type: Math.random() > 0.5 ? "wide" : "life"
      });
    }

    function spawnAsteroid() {
      const stage = currentStage();
      const type = resourceTypes[Math.floor(Math.random() * resourceTypes.length)];
      const radius = 13 + Math.random() * 9;
      state.asteroids.push({
        x: 36 + Math.random() * (canvas.width - 72),
        y: -radius - 8,
        r: radius,
        vy: stage.asteroidSpeed + Math.random() * 55,
        spin: Math.random() * Math.PI * 2,
        spinSpeed: (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 1.4),
        type
      });
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function circleRectCollision(circle, rect) {
      const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
      const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
      const dx = circle.x - cx;
      const dy = circle.y - cy;
      return dx * dx + dy * dy <= circle.r * circle.r;
    }

    function collectAsteroid(asteroid) {
      state.resources[asteroid.type] += 1;
      state.score += 15;
      spawnParticles(asteroid.x, asteroid.y, resources[asteroid.type].color, 14);
      setMessage(`Flurb collected ${resources[asteroid.type].label.toLowerCase()}.`);
    }

    function update(dt) {
      if (state.paused || state.gameOver || state.won) return;
      state.starTime += dt;

      if (keys.has("arrowleft") || keys.has("a")) state.paddle.x -= state.paddle.speed * dt;
      if (keys.has("arrowright") || keys.has("d")) state.paddle.x += state.paddle.speed * dt;
      state.paddle.x = Math.max(16, Math.min(canvas.width - state.paddle.w - 16, state.paddle.x));

      if (!state.launched) {
        state.ball.x = state.paddle.x + state.paddle.w / 2;
        state.ball.y = state.paddle.y - 18;
      } else {
        state.ball.x += state.ball.vx * dt;
        state.ball.y += state.ball.vy * dt;

        if (state.ball.x < state.ball.r) {
          state.ball.x = state.ball.r;
          state.ball.vx *= -1;
        }
        if (state.ball.x > canvas.width - state.ball.r) {
          state.ball.x = canvas.width - state.ball.r;
          state.ball.vx *= -1;
        }
        if (state.ball.y < state.ball.r) {
          state.ball.y = state.ball.r;
          state.ball.vy *= -1;
        }

        if (circleRectCollision(state.ball, state.paddle) && state.ball.vy > 0) {
          const hit = (state.ball.x - (state.paddle.x + state.paddle.w / 2)) / (state.paddle.w / 2);
          const speed = Math.hypot(state.ball.vx, state.ball.vy) + 4;
          state.ball.vx = hit * speed * 0.82;
          state.ball.vy = -Math.max(250, speed * (1 - Math.abs(hit) * 0.16));
          state.ball.y = state.paddle.y - state.ball.r - 1;
          state.combo = 1;
        }

        for (let i = state.bricks.length - 1; i >= 0; i -= 1) {
          const brick = state.bricks[i];
          if (!circleRectCollision(state.ball, brick)) continue;

          brick.hp -= 1;
          state.ball.vy *= -1;
          state.score += 10 * state.combo;
          state.combo = Math.min(9, state.combo + 1);
          spawnParticles(state.ball.x, state.ball.y, brick.color, 8);

          if (brick.hp <= 0) {
            state.bricks.splice(i, 1);
            state.score += 20;
            maybePowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
          }
          break;
        }

        if (state.ball.y > canvas.height + 30) {
          state.lives -= 1;
          if (state.lives <= 0) {
            state.gameOver = true;
            setMessage("Game over. Press R or Restart Game.");
          } else {
            resetBall();
          }
        }
      }

      for (let i = state.powerups.length - 1; i >= 0; i -= 1) {
        const powerup = state.powerups[i];
        powerup.y += powerup.vy * dt;
        if (rectsOverlap(powerup, state.paddle)) {
          if (powerup.type === "wide") {
            state.paddle.w = Math.min(170, state.paddle.w + 24);
            setMessage("Paddle widened. A small mercy.");
          } else {
            state.lives += 1;
            setMessage("Extra life. Flurb found backup courage.");
          }
          state.powerups.splice(i, 1);
        } else if (powerup.y > canvas.height + 20) {
          state.powerups.splice(i, 1);
        }
      }

      state.asteroidTimer -= dt;
      if (state.asteroidTimer <= 0) {
        spawnAsteroid();
        state.asteroidTimer = currentStage().asteroidEvery * (0.82 + Math.random() * 0.36);
      }

      for (let i = state.asteroids.length - 1; i >= 0; i -= 1) {
        const asteroid = state.asteroids[i];
        asteroid.y += asteroid.vy * dt;
        asteroid.spin += asteroid.spinSpeed * dt;
        if (circleRectCollision(asteroid, state.paddle)) {
          collectAsteroid(asteroid);
          state.asteroids.splice(i, 1);
        } else if (asteroid.y - asteroid.r > canvas.height + 20) {
          state.asteroids.splice(i, 1);
        }
      }

      for (let i = state.particles.length - 1; i >= 0; i -= 1) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 180 * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      if (state.bricks.length === 0 && !state.gameOver) nextStage();
      updateUi();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#050816");
      gradient.addColorStop(0.55, "#101733");
      gradient.addColorStop(1, "#1b1230");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const layer of starLayers) {
        ctx.fillStyle = `rgba(245, 239, 230, ${layer.alpha})`;
        for (const star of layer.stars) {
          const y = (star.y + state.starTime * layer.speed) % canvas.height;
          ctx.fillRect(star.x, y, layer.size, layer.size);
        }
      }

      ctx.strokeStyle = "rgba(99, 230, 255, 0.08)";
      ctx.lineWidth = 1;
      for (let y = (state.starTime * 90) % 64; y < canvas.height; y += 64) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y + 18);
        ctx.stroke();
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function drawPixelBlob(time) {
      const frame = Math.floor(time / 260) % blobPoses.length;
      const nextFrame = (frame + 1) % blobPoses.length;
      const blend = (time % 260) / 260;
      const bounce = Math.sin(time / 180) * 3;
      const x = state.blob.x;
      const y = state.blob.y + bounce;
      const s = state.blob.scale;
      const pose = blend < 0.5 ? blobPoses[frame] : blobPoses[nextFrame];

      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath();
      ctx.ellipse(x + 22, y + 39, 30, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      const palette = {
        "1": "#151a22",
        "2": "#f6efe6",
        "3": blend < 0.5 ? "#d85cff" : "#63e6ff"
      };

      for (let row = 0; row < pose.length; row += 1) {
        for (let col = 0; col < pose[row].length; col += 1) {
          const value = pose[row][col];
          if (value === "0") continue;
          ctx.fillStyle = palette[value];
          ctx.fillRect(x + col * s, y + row * s, s, s);
        }
      }

      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.fillRect(x + 5 * s, y + 1 * s, s, s);
    }

    function drawAsteroid(asteroid) {
      const material = resources[asteroid.type];
      ctx.save();
      ctx.translate(asteroid.x, asteroid.y);
      ctx.rotate(asteroid.spin);
      ctx.fillStyle = "#5d6470";
      ctx.beginPath();
      for (let i = 0; i < 9; i += 1) {
        const angle = (Math.PI * 2 * i) / 9;
        const wobble = asteroid.r * (0.74 + seededNoise(i + asteroid.r) * 0.38);
        ctx.lineTo(Math.cos(angle) * wobble, Math.sin(angle) * wobble);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = material.color;
      ctx.fillRect(-4, -4, 8, 8);
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(-asteroid.r * 0.4, -asteroid.r * 0.45, 5, 5);
      ctx.restore();
    }

    function drawFlurbHud() {
      const x = state.blob.x - 16;
      const y = state.blob.y + 48;
      ctx.fillStyle = "rgba(5, 8, 22, 0.78)";
      roundRect(x, y, 92, 48, 7);
      ctx.fillStyle = "#f5efe6";
      ctx.font = "bold 10px Segoe UI";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("FLURB", x + 9, y + 6);

      let row = 0;
      for (const type of resourceTypes) {
        const resource = resources[type];
        const ry = y + 20 + row * 8;
        ctx.fillStyle = resource.color;
        ctx.fillRect(x + 9, ry + 1, 6, 6);
        ctx.fillStyle = "#d8dce4";
        ctx.font = "9px Segoe UI";
        ctx.fillText(`${resource.short}: ${state.resources[type]}`, x + 20, ry - 1);
        row += 1;
      }
    }

    function draw(time) {
      drawBackground();

      for (const brick of state.bricks) {
        ctx.fillStyle = brick.hp > 1 ? "#f3d088" : brick.color;
        roundRect(brick.x, brick.y, brick.w, brick.h, 5);
        ctx.fillStyle = "rgba(255,255,255,0.16)";
        ctx.fillRect(brick.x + 6, brick.y + 5, brick.w - 12, 3);
      }

      for (const powerup of state.powerups) {
        ctx.fillStyle = powerup.type === "wide" ? "#86acd9" : "#83c27d";
        roundRect(powerup.x, powerup.y, powerup.w, powerup.h, 4);
        ctx.fillStyle = "#101317";
        ctx.font = "bold 12px Segoe UI";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(powerup.type === "wide" ? "W" : "+", powerup.x + powerup.w / 2, powerup.y + powerup.h / 2);
      }

      for (const asteroid of state.asteroids) {
        drawAsteroid(asteroid);
      }

      for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = "#f5efe6";
      roundRect(state.paddle.x, state.paddle.y, state.paddle.w, state.paddle.h, 7);
      ctx.fillStyle = "#dfb85b";
      ctx.fillRect(state.paddle.x + 10, state.paddle.y + 3, state.paddle.w - 20, 3);

      ctx.fillStyle = "#f5dc7a";
      ctx.beginPath();
      ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.beginPath();
      ctx.arc(state.ball.x - 3, state.ball.y - 3, 3, 0, Math.PI * 2);
      ctx.fill();

      if (!state.launched && !state.gameOver && !state.won) drawOverlay("Ready", "Press Space to launch");
      if (state.paused) drawOverlay("Paused", "Press P to resume");
      if (state.gameOver) drawOverlay("Game Over", "Press R to restart");
      if (state.won) drawOverlay("Cleared", "Every board is clean");

      drawPixelBlob(time);
      drawFlurbHud();
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = "rgba(16, 19, 23, 0.64)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f5efe6";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 44px Segoe UI";
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 18);
      ctx.fillStyle = "#b7afa3";
      ctx.font = "18px Segoe UI";
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 26);
    }

    function updateUi() {
      scoreLabel.textContent = `${state.score} pts`;
      stageLabel.textContent = `${state.stageIndex + 1}`;
      livesLabel.textContent = state.lives;
      bricksLabel.textContent = state.bricks.length;
      comboLabel.textContent = `x${state.combo}`;
      startButton.textContent = state.paused ? "Resume" : state.launched ? "Ball In Play" : "Launch Ball";
      startButton.disabled = state.launched && !state.paused;
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw(now);
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowleft", "arrowright", "w", "a", "s", "d", " ", "p", "r"].includes(key)) event.preventDefault();
      if (key === " ") launch();
      else if (key === "p") {
        if (!state.gameOver && !state.won) {
          state.paused = !state.paused;
          setMessage(state.paused ? "Paused." : "Back in motion.");
        }
      } else if (key === "r") restartGame();
      else keys.add(key);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    startButton.addEventListener("click", launch);
    restartButton.addEventListener("click", restartGame);

    restartGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
