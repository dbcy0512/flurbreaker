<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flurbreaker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101317;
      --panel: #1b222b;
      --panel-2: #242d38;
      --text: #f5efe6;
      --muted: #b7afa3;
      --line: #3a4654;
      --gold: #dfb85b;
      --green: #83c27d;
      --blue: #86acd9;
      --rose: #d67f7a;
      --neon-cyan: #63e6ff;
      --neon-pink: #ff5cc8;
      --neon-gold: #ffd166;
      --neon-green: #9cffb6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(223, 184, 91, 0.14), transparent 34%),
        linear-gradient(225deg, rgba(99, 230, 255, 0.13), transparent 38%),
        linear-gradient(0deg, rgba(255, 92, 200, 0.07), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .shell {
      width: min(1120px, calc(100vw - 28px));
      display: grid;
      grid-template-columns: minmax(0, 800px) 280px;
      gap: 16px;
      align-items: start;
    }

    main,
    aside {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 34, 43, 0.94);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28), 0 0 28px rgba(99, 230, 255, 0.05);
    }

    main {
      padding: 14px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding: 4px 2px 12px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
    }

    .subtitle,
    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .score {
      min-width: 150px;
      text-align: right;
      color: var(--neon-gold);
      font-weight: 700;
      text-shadow: 0 0 14px rgba(255, 209, 102, 0.24);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111820;
      box-shadow: inset 0 0 26px rgba(99, 230, 255, 0.05);
    }

    aside {
      padding: 16px;
    }

    section + section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 10px;
      box-shadow: inset 0 0 14px rgba(99, 230, 255, 0.035);
    }

    .stat strong {
      display: block;
      font-size: 18px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      min-height: 42px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--neon-gold);
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.13);
    }

    .message {
      min-height: 48px;
      color: var(--muted);
      line-height: 1.45;
    }

    @media (max-width: 920px) {
      body {
        display: block;
        padding: 14px 0;
      }

      .shell {
        grid-template-columns: 1fr;
        width: min(800px, calc(100vw - 24px));
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <header>
        <div>
          <h1>Flurbreaker</h1>
          <div class="subtitle">Guide Flurb through asteroid space.</div>
        </div>
        <div class="score" id="scoreLabel">0 pts</div>
      </header>
      <canvas id="game" width="800" height="500" aria-label="Flurbreaker brick breaker game"></canvas>
    </main>

    <aside>
      <section>
        <h2>Status</h2>
        <div class="stat-grid">
          <div class="stat"><strong id="stageLabel">1-1</strong><span>Level</span></div>
          <div class="stat"><strong id="livesLabel">3</strong><span>Lives</span></div>
          <div class="stat"><strong id="bricksLabel">0</strong><span>Bricks</span></div>
          <div class="stat"><strong id="comboLabel">x1</strong><span>Combo</span></div>
        </div>
      </section>

      <section>
        <h2>Controls</h2>
        <div class="controls">
          <span>Move: WASD, currently A/D</span>
          <span>Launch: Space</span>
          <span>Pause: P</span>
          <span>Restart: R</span>
        </div>
        <button id="startButton" type="button">Launch Pulse</button>
        <button id="soundButton" type="button">Test Sound</button>
        <button id="restartButton" type="button">Restart Game</button>
      </section>

      <section>
        <h2>Console</h2>
        <div class="message" id="message">Press Space to launch. A/D to move.</div>
      </section>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreLabel = document.getElementById("scoreLabel");
    const stageLabel = document.getElementById("stageLabel");
    const livesLabel = document.getElementById("livesLabel");
    const bricksLabel = document.getElementById("bricksLabel");
    const comboLabel = document.getElementById("comboLabel");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const soundButton = document.getElementById("soundButton");
    const restartButton = document.getElementById("restartButton");

    const colors = ["#dfb85b", "#83c27d", "#86acd9", "#d67f7a", "#b58ce0"];
    const neon = {
      cyan: "#63e6ff",
      pink: "#ff5cc8",
      gold: "#ffd166",
      green: "#9cffb6",
      violet: "#b66cff"
    };
    const audio = {
      ctx: null,
      master: null,
      unlocked: false,
      muted: false,
      connected: false
    };
    const keys = new Set();

    const zones = [
      {
        id: "space-navigation",
        name: "Space Navigation",
        theme: "Flurb learns to route through asteroid corridors.",
        levels: [
          {
            name: "Driftstone Field",
            role: "Tutorial",
            type: "breaker",
            material: "driftstone",
            ballSpeed: 270,
            paddleWidth: 120,
            lesson: "Launch, steer, break, collect.",
            layout: [
              "...1111...",
              "..111111..",
              ".11122111.",
              "..111111..",
              "...1111..."
            ]
          },
          {
            name: "Broken Orbit",
            role: "Navigation",
            type: "breaker",
            material: "driftstone",
            ballSpeed: 292,
            paddleWidth: 116,
            lesson: "Read gaps and rebound angles.",
            layout: [
              "..112211..",
              ".11....11.",
              "11..22..11",
              ".11....11.",
              "..112211..",
              "....11...."
            ]
          },
          {
            name: "Dense Belt",
            role: "Navigation",
            type: "breaker",
            material: "driftstone",
            ballSpeed: 314,
            paddleWidth: 110,
            lesson: "Manage tougher stone and denser routes.",
            layout: [
              "2222222222",
              "1222222221",
              ".11233211.",
              "..122221..",
              ".11233211.",
              "1222222221"
            ]
          },
          {
            name: "Approach Vector",
            role: "Navigation",
            type: "breaker",
            material: "driftstone",
            ballSpeed: 336,
            paddleWidth: 104,
            lesson: "Prepare for the zone boss route.",
            layout: [
              "3...22...3",
              ".3..22..3.",
              "..332233..",
              "...2222...",
              "..112211..",
              ".11111111."
            ]
          },
          {
            name: "Driftmass Signal",
            role: "Boss",
            type: "boss",
            material: "driftstone",
            ballSpeed: 348,
            paddleWidth: 104,
            lesson: "Crack the outer driftstone pieces, then expose the core."
          }
        ]
      }
    ];

    const currentZone = zones[0];
    const levels = currentZone.levels;
    const starLayers = [
      { speed: 16, size: 1, alpha: 0.42, stars: makeStars(60, 11) },
      { speed: 34, size: 1.6, alpha: 0.62, stars: makeStars(38, 29) },
      { speed: 62, size: 2.3, alpha: 0.88, stars: makeStars(22, 47) }
    ];
    const nebulaClouds = [
      { x: 138, y: 92, r: 170, color: "rgba(216, 92, 255, 0.18)", speed: 9 },
      { x: 628, y: 238, r: 210, color: "rgba(99, 230, 255, 0.14)", speed: 13 },
      { x: 410, y: 455, r: 185, color: "rgba(223, 184, 91, 0.11)", speed: 7 }
    ];
    const routeBeacons = [
      { x: 90, y: 94, drift: 0.3 },
      { x: 214, y: 72, drift: 0.7 },
      { x: 585, y: 118, drift: 1.1 },
      { x: 704, y: 238, drift: 1.5 },
      { x: 548, y: 404, drift: 1.9 }
    ];

    const state = {
      stageIndex: 0,
      mode: "splash",
      score: 0,
      lives: 3,
      combo: 1,
      running: true,
      launched: false,
      paused: false,
      gameOver: false,
      won: false,
      paddle: { x: 340, y: 456, w: 120, h: 14, speed: 560 },
      ball: { x: 400, y: 434, r: 8, vx: 230, vy: -260 },
      bricks: [],
      particles: [],
      pulseTrail: [],
      powerups: [],
      droppedBossPieces: [],
      boss: null,
      starTime: 0
    };

    const flurbPoses = [
      [
        "000111000",
        "001333100",
        "013333310",
        "133232331",
        "133333331",
        "013333310",
        "001111100"
      ],
      [
        "000111100",
        "001333310",
        "013333331",
        "133223331",
        "133333310",
        "011333100",
        "000111000"
      ],
      [
        "001111000",
        "013333100",
        "133333310",
        "133322331",
        "013333331",
        "001333100",
        "000111000"
      ]
    ];

    function seededNoise(seed) {
      const value = Math.sin(seed * 999.97) * 10000;
      return value - Math.floor(value);
    }

    function makeStars(count, offset) {
      const stars = [];
      for (let i = 0; i < count; i += 1) {
        stars.push({
          x: seededNoise(i + offset) * canvas.width,
          y: seededNoise(i * 2 + offset) * canvas.height
        });
      }
      return stars;
    }

    function resetBall() {
      state.launched = false;
      state.combo = 1;
      state.ball.x = state.paddle.x + state.paddle.w / 2;
      state.ball.y = state.paddle.y - 18;
      const level = currentLevel();
      const speed = level.ballSpeed;
      state.ball.vx = (Math.random() > 0.5 ? 1 : -1) * (150 + state.stageIndex * 28);
      state.ball.vy = -speed;
      state.pulseTrail = [];
      setMessage("Pulse Core ready. Launch when you are.");
    }

    function currentLevel() {
      return levels[state.stageIndex];
    }

    function makeStage(stageIndex) {
      state.bricks = [];
      state.boss = null;
      state.droppedBossPieces = [];
      state.powerups = [];
      state.particles = [];
      state.pulseTrail = [];
      const level = levels[stageIndex];
      const cols = 10;
      const gap = 8;
      const brickW = (canvas.width - 80 - gap * (cols - 1)) / cols;
      const brickH = 24;
      state.paddle.w = level.paddleWidth;
      state.paddle.x = canvas.width / 2 - state.paddle.w / 2;

      if (level.type === "boss") {
        makeDriftmassBoss();
        resetBall();
        updateUi();
        return;
      }

      for (let row = 0; row < level.layout.length; row += 1) {
        const line = level.layout[row].padEnd(cols, ".");
        for (let col = 0; col < cols; col += 1) {
          const cell = line[col];
          if (cell === ".") continue;
          const hp = Number(cell);
          state.bricks.push({
            x: 40 + col * (brickW + gap),
            y: 58 + row * (brickH + gap),
            w: brickW,
            h: brickH,
            hp,
            maxHp: hp,
            color: colors[(hp + row + col) % colors.length],
            material: level.material,
            row,
            col
          });
        }
      }
      resetBall();
      updateUi();
    }

    function makeDriftmassBoss() {
      state.boss = {
        x: canvas.width / 2,
        y: 150,
        vx: 34,
        phase: 0,
        coreOpen: false,
        pieces: [
          { id: "top", label: "North Shard", dx: 0, dy: -58, r: 30, hp: 3, maxHp: 3, active: true },
          { id: "left", label: "West Shard", dx: -92, dy: 6, r: 33, hp: 3, maxHp: 3, active: true },
          { id: "right", label: "East Shard", dx: 92, dy: 6, r: 33, hp: 3, maxHp: 3, active: true },
          { id: "bottom", label: "South Shard", dx: 0, dy: 66, r: 35, hp: 3, maxHp: 3, active: true },
          { id: "core", label: "Signal Core", dx: 0, dy: 8, r: 38, hp: 8, maxHp: 8, active: false, core: true }
        ]
      };
    }

    function setMessage(text) {
      message.textContent = text;
    }

    function unlockAudio() {
      if (audio.unlocked || audio.muted) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        audio.muted = true;
        setMessage("Audio unavailable in this browser.");
        return;
      }
      audio.ctx = audio.ctx || new AudioContext();
      audio.master = audio.master || audio.ctx.createGain();
      audio.master.gain.value = 0.96;
      if (!audio.connected) {
        audio.master.connect(audio.ctx.destination);
        audio.connected = true;
      }
      audio.unlocked = true;
      if (audio.ctx.state === "suspended") {
        audio.ctx.resume().catch(() => {
          audio.muted = true;
          setMessage("Audio was blocked by the browser.");
        });
      }
    }

    function playTone(frequency, duration = 0.12, options = {}) {
      if (!audio.unlocked || audio.muted || !audio.ctx) return;
      if (audio.ctx.state === "suspended") {
        audio.ctx.resume().then(() => playTone(frequency, duration, options)).catch(() => {
          audio.muted = true;
          setMessage("Audio was blocked by the browser.");
        });
        return;
      }
      const now = audio.ctx.currentTime;
      const osc = audio.ctx.createOscillator();
      const gain = audio.ctx.createGain();
      const filter = audio.ctx.createBiquadFilter();
      const volume = options.volume ?? 0.22;
      const attack = options.attack ?? 0.008;
      const release = options.release ?? 0.05;

      osc.type = options.type ?? "sine";
      osc.frequency.setValueAtTime(frequency, now);
      if (options.endFrequency) osc.frequency.exponentialRampToValueAtTime(Math.max(20, options.endFrequency), now + duration);
      if (options.detune) osc.detune.setValueAtTime(options.detune, now);
      filter.type = options.filterType ?? "lowpass";
      filter.frequency.value = options.filter ?? 2400;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + release);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audio.master);
      osc.start(now);
      osc.stop(now + duration + release + 0.02);
    }

    function playNoise(duration = 0.12, options = {}) {
      if (!audio.unlocked || audio.muted || !audio.ctx) return;
      if (audio.ctx.state === "suspended") {
        audio.ctx.resume().then(() => playNoise(duration, options)).catch(() => {
          audio.muted = true;
          setMessage("Audio was blocked by the browser.");
        });
        return;
      }
      const now = audio.ctx.currentTime;
      const bufferSize = Math.max(1, Math.floor(audio.ctx.sampleRate * duration));
      const buffer = audio.ctx.createBuffer(1, bufferSize, audio.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      const source = audio.ctx.createBufferSource();
      const gain = audio.ctx.createGain();
      const filter = audio.ctx.createBiquadFilter();
      source.buffer = buffer;
      filter.type = options.filterType ?? "bandpass";
      filter.frequency.value = options.filter ?? 900;
      filter.Q.value = options.q ?? 1.2;
      gain.gain.setValueAtTime(options.volume ?? 0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audio.master);
      source.start(now);
    }

    function playSound(name) {
      if (!audio.unlocked || audio.muted) return;
      if (name === "start") {
        playTone(330, 0.09, { type: "triangle", volume: 0.16, filter: 1800 });
        setTimeout(() => playTone(495, 0.16, { type: "triangle", volume: 0.13, filter: 2200 }), 70);
      } else if (name === "test") {
        playTone(440, 0.12, { type: "triangle", volume: 0.26, filter: 2600 });
        setTimeout(() => playTone(660, 0.12, { type: "sine", volume: 0.24, filter: 3200 }), 90);
        setTimeout(() => playTone(880, 0.2, { type: "sine", volume: 0.22, filter: 3600 }), 180);
      } else if (name === "launch") {
        playTone(180, 0.16, { type: "sawtooth", endFrequency: 520, volume: 0.14, filter: 1800 });
        playTone(720, 0.08, { type: "sine", volume: 0.08, filter: 2600 });
      } else if (name === "paddle") {
        playTone(260, 0.06, { type: "triangle", endFrequency: 360, volume: 0.08, filter: 1600 });
      } else if (name === "brick-hit") {
        playTone(420, 0.045, { type: "square", endFrequency: 300, volume: 0.055, filter: 1200 });
      } else if (name === "brick-break") {
        playNoise(0.11, { volume: 0.08, filter: 1300, q: 1.6 });
        playTone(640, 0.08, { type: "triangle", volume: 0.07, filter: 2800 });
      } else if (name === "powerup") {
        playTone(620, 0.07, { type: "sine", volume: 0.1, filter: 2600 });
        setTimeout(() => playTone(930, 0.11, { type: "sine", volume: 0.09, filter: 3000 }), 55);
      } else if (name === "miss") {
        playTone(180, 0.18, { type: "triangle", endFrequency: 96, volume: 0.11, filter: 900 });
      } else if (name === "gameover") {
        playTone(196, 0.18, { type: "triangle", volume: 0.12, filter: 1000 });
        setTimeout(() => playTone(130, 0.22, { type: "triangle", volume: 0.1, filter: 800 }), 110);
      } else if (name === "stage-clear") {
        playTone(440, 0.08, { type: "triangle", volume: 0.09, filter: 2400 });
        setTimeout(() => playTone(660, 0.1, { type: "triangle", volume: 0.09, filter: 2600 }), 70);
        setTimeout(() => playTone(990, 0.16, { type: "sine", volume: 0.08, filter: 3200 }), 150);
      } else if (name === "boss-hit") {
        playTone(110, 0.09, { type: "sawtooth", endFrequency: 82, volume: 0.12, filter: 900 });
        playNoise(0.08, { volume: 0.05, filter: 700, q: 2 });
      } else if (name === "boss-break") {
        playNoise(0.2, { volume: 0.11, filter: 620, q: 1.5 });
        playTone(260, 0.16, { type: "sawtooth", endFrequency: 180, volume: 0.1, filter: 1000 });
      } else if (name === "core-open") {
        playTone(246, 0.18, { type: "triangle", endFrequency: 492, volume: 0.1, filter: 1800 });
        setTimeout(() => playTone(738, 0.24, { type: "sine", volume: 0.09, filter: 3000 }), 120);
      } else if (name === "zone-clear") {
        playTone(392, 0.1, { type: "triangle", volume: 0.09, filter: 2400 });
        setTimeout(() => playTone(587, 0.14, { type: "triangle", volume: 0.09, filter: 2800 }), 90);
        setTimeout(() => playTone(880, 0.26, { type: "sine", volume: 0.1, filter: 3600 }), 210);
      } else if (name === "pause") {
        playTone(320, 0.06, { type: "sine", volume: 0.07, filter: 1800 });
      }
    }

    function testSound() {
      unlockAudio();
      playSound("test");
      setMessage(audio.muted ? "Audio unavailable in this browser." : "Sound test sent. If silent, check browser/tab/system volume.");
    }

    function launch() {
      unlockAudio();
      if (state.mode === "splash") {
        state.mode = "ready";
        setMessage("Signal locked. Press Space again to launch the Pulse Core.");
        playSound("start");
        updateUi();
        return;
      }
      if (state.mode === "bay") {
        playSound("start");
        beginStage(state.stageIndex + 1);
        return;
      }
      if (state.gameOver || state.won) return;
      if (state.paused) {
        state.paused = false;
        setMessage("Back in motion.");
        playSound("pause");
      }
      if (!state.launched) {
        state.mode = "playing";
        state.launched = true;
        playSound("launch");
        setMessage("Clear the board.");
      }
    }

    function restartGame(showSplash = true) {
      state.stageIndex = 0;
      state.mode = showSplash ? "splash" : "ready";
      state.score = 0;
      state.lives = 3;
      state.combo = 1;
      state.starTime = 0;
      state.gameOver = false;
      state.won = false;
      state.paused = false;
      makeStage(0);
      setMessage(showSplash ? "Signal drifting. Press Space to identify Flurb." : "Fresh board. Press Space to launch.");
      updateUi();
    }

    function beginStage(stageIndex) {
      state.stageIndex = stageIndex;
      makeStage(stageIndex);
      state.mode = "ready";
      setMessage(`${currentZone.name} ${state.stageIndex + 1}: ${currentLevel().name}.`);
    }

    function nextStage() {
      const nextIndex = state.stageIndex + 1;
      if (nextIndex >= levels.length) {
        state.won = true;
        state.launched = false;
        playSound("zone-clear");
        setMessage(`${currentZone.name} route clear. Boss signal reserved for later.`);
        updateUi();
        return;
      }
      state.mode = "bay";
      state.launched = false;
      state.powerups = [];
      state.pulseTrail = [];
      playSound("stage-clear");
      setMessage("Flurb Bay: route check complete. Press Space to continue.");
      updateUi();
    }

    function spawnParticles(x, y, color, count = 10, options = {}) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (options.minSpeed ?? 70) + Math.random() * (options.maxSpeed ?? 160);
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: (options.life ?? 0.45) + Math.random() * (options.lifeJitter ?? 0.35),
          maxLife: options.life ?? 0.45,
          color,
          size: (options.size ?? 4) + Math.random() * (options.sizeJitter ?? 0),
          gravity: options.gravity ?? 180,
          shape: options.shape ?? "square",
          spin: Math.random() * Math.PI * 2,
          spinSpeed: (Math.random() - 0.5) * (options.spin ?? 5)
        });
      }
    }

    function spawnBrickBreakEffect(brick) {
      if (brick.material === "driftstone") {
        const cx = brick.x + brick.w / 2;
        const cy = brick.y + brick.h / 2;
        spawnParticles(cx, cy, "#8fa0a7", 18, { shape: "chip", minSpeed: 90, maxSpeed: 230, life: 0.48, lifeJitter: 0.32, size: 4, sizeJitter: 4, gravity: 240, spin: 9 });
        spawnParticles(cx, cy, "#63e6ff", 7, { shape: "spark", minSpeed: 80, maxSpeed: 190, life: 0.38, lifeJitter: 0.22, size: 2, sizeJitter: 2, gravity: 60 });
        return;
      }

      spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 18, { shape: "spark", minSpeed: 120, maxSpeed: 260, life: 0.36, lifeJitter: 0.24, size: 3, sizeJitter: 2, gravity: 80 });
    }

    function spawnBossPieceBreakEffect(piece) {
      spawnParticles(piece.x, piece.y, "#8fa0a7", 28, { shape: "chip", minSpeed: 110, maxSpeed: 280, life: 0.58, lifeJitter: 0.38, size: 5, sizeJitter: 5, gravity: 210, spin: 10 });
      spawnParticles(piece.x, piece.y, piece.core ? "#dfb85b" : "#63e6ff", piece.core ? 18 : 10, { shape: "spark", minSpeed: 100, maxSpeed: 250, life: 0.42, lifeJitter: 0.25, size: 2, sizeJitter: 3, gravity: 45 });
    }

    function maybePowerup(x, y) {
      if (Math.random() > 0.12) return;
      state.powerups.push({
        x,
        y,
        w: 22,
        h: 16,
        vy: 105,
        type: Math.random() > 0.5 ? "wide" : "life"
      });
    }

    function spawnImpactBurst(x, y, color, count = 14) {
      spawnParticles(x, y, color, count, { shape: "spark", minSpeed: 95, maxSpeed: 210, life: 0.32, lifeJitter: 0.18, size: 2, sizeJitter: 2, gravity: 80 });
      state.pulseTrail.push({ x, y, life: 0.24, r: 18, impact: true, color });
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function circleRectCollision(circle, rect) {
      const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
      const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
      const dx = circle.x - cx;
      const dy = circle.y - cy;
      return dx * dx + dy * dy <= circle.r * circle.r;
    }

    function circleCircleCollision(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const radius = a.r + b.r;
      return dx * dx + dy * dy <= radius * radius;
    }

    function hitBossPiece(piece) {
      if (piece.hitCooldown > 0) return;
      piece.hitCooldown = 0.18;
      piece.hp -= 1;
      state.ball.vy *= -1;
      state.score += piece.core ? 35 * state.combo : 20 * state.combo;
      state.combo = Math.min(9, state.combo + 1);
      playSound("boss-hit");
      spawnImpactBurst(state.ball.x, state.ball.y, piece.core ? "#dfb85b" : "#63e6ff", 12);

      if (piece.hp > 0) return;

      piece.active = false;
      playSound("boss-break");
      spawnBossPieceBreakEffect(piece);
      if (!piece.core) {
        state.droppedBossPieces.push({
          x: piece.x,
          y: piece.y,
          r: piece.r,
          vx: (piece.dx >= 0 ? 1 : -1) * (55 + Math.random() * 60),
          vy: 70 + Math.random() * 45,
          spin: Math.random() * Math.PI * 2,
          spinSpeed: (Math.random() > 0.5 ? 1 : -1) * (1.6 + Math.random() * 1.8),
          life: 2.4
        });
        if (state.boss.pieces.filter((part) => !part.core).every((part) => !part.active)) {
          const core = state.boss.pieces.find((part) => part.core);
          core.active = true;
          state.boss.coreOpen = true;
          playSound("core-open");
          setMessage("Driftmass core exposed. Crack the signal.");
        }
        return;
      }

      state.won = true;
      state.launched = false;
      state.powerups = [];
      playSound("zone-clear");
      setMessage("Driftmass cracked. Zone 1 route clear.");
      updateUi();
    }

    function updateBoss(dt) {
      if (!state.boss) return;
      state.boss.phase += dt;
      state.boss.x += state.boss.vx * dt;
      if (state.boss.x < 275 || state.boss.x > 525) state.boss.vx *= -1;

      for (const piece of state.boss.pieces) {
        piece.hitCooldown = Math.max(0, (piece.hitCooldown || 0) - dt);
        piece.x = state.boss.x + piece.dx + Math.sin(state.boss.phase * 1.4 + piece.dy) * 4;
        piece.y = state.boss.y + piece.dy + Math.cos(state.boss.phase * 1.1 + piece.dx) * 4;
      }
    }

    function updateDroppedBossPieces(dt) {
      for (let i = state.droppedBossPieces.length - 1; i >= 0; i -= 1) {
        const piece = state.droppedBossPieces[i];
        piece.x += piece.vx * dt;
        piece.y += piece.vy * dt;
        piece.vy += 70 * dt;
        piece.spin += piece.spinSpeed * dt;
        piece.life -= dt;
        if (piece.life <= 0 || piece.y - piece.r > canvas.height + 60) state.droppedBossPieces.splice(i, 1);
      }
    }

    function handlePulseMiss() {
      state.lives -= 1;
      state.launched = false;

      if (state.lives <= 0) {
        state.mode = "gameover";
        state.gameOver = true;
        state.powerups = [];
        playSound("gameover");
        setMessage("Game over. Press R or Restart Game.");
        return;
      }

      state.mode = "ready";
      resetBall();
      playSound("miss");
      setMessage("Pulse missed. Press Space to launch again.");
    }

    function update(dt) {
      state.starTime += dt;
      updateDroppedBossPieces(dt);
      if (state.mode === "splash" || state.mode === "bay" || state.paused || state.gameOver || state.won) return;
      updateBoss(dt);

      const movingLeft = keys.has("arrowleft") || keys.has("a");
      const movingRight = keys.has("arrowright") || keys.has("d");
      state.paddle.thrust = movingLeft ? -1 : movingRight ? 1 : 0;
      if (movingLeft) state.paddle.x -= state.paddle.speed * dt;
      if (movingRight) state.paddle.x += state.paddle.speed * dt;
      state.paddle.x = Math.max(16, Math.min(canvas.width - state.paddle.w - 16, state.paddle.x));

      if (!state.launched) {
        state.ball.x = state.paddle.x + state.paddle.w / 2;
        state.ball.y = state.paddle.y - 18;
      } else {
        state.ball.x += state.ball.vx * dt;
        state.ball.y += state.ball.vy * dt;

        if (state.ball.x < state.ball.r) {
          state.ball.x = state.ball.r;
          state.ball.vx *= -1;
        }
        if (state.ball.x > canvas.width - state.ball.r) {
          state.ball.x = canvas.width - state.ball.r;
          state.ball.vx *= -1;
        }
        if (state.ball.y < state.ball.r) {
          state.ball.y = state.ball.r;
          state.ball.vy *= -1;
        }

        if (circleRectCollision(state.ball, state.paddle) && state.ball.vy > 0) {
          const hit = (state.ball.x - (state.paddle.x + state.paddle.w / 2)) / (state.paddle.w / 2);
          const speed = Math.hypot(state.ball.vx, state.ball.vy) + 4;
          state.ball.vx = hit * speed * 0.82;
          state.ball.vy = -Math.max(250, speed * (1 - Math.abs(hit) * 0.16));
          state.ball.y = state.paddle.y - state.ball.r - 1;
          state.combo = 1;
          playSound("paddle");
          spawnImpactBurst(state.ball.x, state.ball.y, "#63e6ff", 10);
        }

        for (let i = state.bricks.length - 1; i >= 0; i -= 1) {
          const brick = state.bricks[i];
          if (!circleRectCollision(state.ball, brick)) continue;

          brick.hp -= 1;
          state.ball.vy *= -1;
          state.score += 10 * state.combo;
          state.combo = Math.min(9, state.combo + 1);
          playSound(brick.hp <= 0 ? "brick-break" : "brick-hit");
          spawnImpactBurst(state.ball.x, state.ball.y, brick.color, 8);

          if (brick.hp <= 0) {
            spawnBrickBreakEffect(brick);
            state.bricks.splice(i, 1);
            state.score += 20;
            maybePowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
          }
          break;
        }

        if (state.boss) {
          for (const piece of state.boss.pieces) {
            if (!piece.active) continue;
            if (!circleCircleCollision(state.ball, piece)) continue;
            hitBossPiece(piece);
            break;
          }
        }

        if (state.ball.y > canvas.height + 30) handlePulseMiss();
      }

      for (let i = state.powerups.length - 1; i >= 0; i -= 1) {
        const powerup = state.powerups[i];
        powerup.y += powerup.vy * dt;
        if (rectsOverlap(powerup, state.paddle)) {
          playSound("powerup");
          if (powerup.type === "wide") {
            state.paddle.w = Math.min(170, state.paddle.w + 24);
            setMessage("Paddle widened. A small mercy.");
          } else {
            state.lives += 1;
            setMessage("Extra life. Flurb found backup courage.");
          }
          state.powerups.splice(i, 1);
        } else if (powerup.y > canvas.height + 20) {
          state.powerups.splice(i, 1);
        }
      }

      for (let i = state.particles.length - 1; i >= 0; i -= 1) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += p.gravity * dt;
        p.spin += p.spinSpeed * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      if (state.launched) {
        state.pulseTrail.push({
          x: state.ball.x,
          y: state.ball.y,
          life: 0.28,
          r: state.ball.r,
          impact: false,
          color: "#63e6ff"
        });
      }
      for (let i = state.pulseTrail.length - 1; i >= 0; i -= 1) {
        const trail = state.pulseTrail[i];
        trail.life -= dt;
        if (trail.life <= 0) state.pulseTrail.splice(i, 1);
      }

      if (currentLevel().type === "breaker" && state.bricks.length === 0 && !state.gameOver) nextStage();
      updateUi();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#050816");
      gradient.addColorStop(0.55, "#101733");
      gradient.addColorStop(1, "#1b1230");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const cloud of nebulaClouds) {
        const y = (cloud.y + state.starTime * cloud.speed) % (canvas.height + cloud.r * 2) - cloud.r;
        const nebula = ctx.createRadialGradient(cloud.x, y, 0, cloud.x, y, cloud.r);
        nebula.addColorStop(0, cloud.color);
        nebula.addColorStop(0.55, cloud.color.replace(/0\.\d+\)/, "0.06)"));
        nebula.addColorStop(1, "rgba(5, 8, 22, 0)");
        ctx.fillStyle = nebula;
        ctx.beginPath();
        ctx.arc(cloud.x, y, cloud.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.strokeStyle = "rgba(99, 230, 255, 0.24)";
      ctx.lineWidth = 1;
      ctx.setLineDash([7, 16]);
      ctx.beginPath();
      routeBeacons.forEach((beacon, index) => {
        const x = beacon.x + Math.sin(state.starTime * 1.4 + beacon.drift) * 8;
        const y = (beacon.y + state.starTime * 22) % (canvas.height + 80) - 40;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      for (const layer of starLayers) {
        ctx.fillStyle = `rgba(245, 239, 230, ${layer.alpha})`;
        for (const star of layer.stars) {
          const y = (star.y + state.starTime * layer.speed) % canvas.height;
          ctx.fillRect(star.x, y, layer.size, layer.size);
        }
      }

      ctx.save();
      for (const beacon of routeBeacons) {
        const pulse = 0.5 + Math.sin(state.starTime * 5 + beacon.drift) * 0.28;
        const x = beacon.x + Math.sin(state.starTime * 1.4 + beacon.drift) * 8;
        const y = (beacon.y + state.starTime * 22) % (canvas.height + 80) - 40;
        ctx.strokeStyle = `rgba(99, 230, 255, ${0.18 + pulse * 0.24})`;
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 5, y - 5, 10, 10);
        ctx.fillStyle = `rgba(245, 239, 230, ${0.22 + pulse * 0.28})`;
        ctx.fillRect(x - 1, y - 1, 2, 2);
      }
      ctx.restore();

      const planetY = 82 + Math.sin(state.starTime * 0.8) * 8;
      ctx.save();
      ctx.globalAlpha = 0.36;
      ctx.fillStyle = "#5f6b78";
      ctx.beginPath();
      ctx.arc(694, planetY, 29, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(223, 184, 91, 0.42)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(694, planetY + 2, 48, 12, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = "#63e6ff";
      ctx.beginPath();
      ctx.arc(122, 390 + Math.sin(state.starTime) * 5, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = "rgba(99, 230, 255, 0.08)";
      ctx.lineWidth = 1;
      for (let y = (state.starTime * 90) % 64; y < canvas.height; y += 64) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y + 18);
        ctx.stroke();
      }

      ctx.save();
      ctx.strokeStyle = "rgba(245, 239, 230, 0.06)";
      ctx.lineWidth = 1;
      for (let x = -40 + (state.starTime * 18) % 96; x < canvas.width + 80; x += 96) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 54, canvas.height);
        ctx.stroke();
      }
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function neonStroke(color, blur, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = color;
      ctx.shadowBlur = blur;
      ctx.strokeStyle = color;
      ctx.stroke();
      ctx.restore();
    }

    function drawBrick(brick) {
      if (brick.material === "driftstone") {
        const damage = 1 - brick.hp / brick.maxHp;
        const base = brick.hp > 1 ? "#8e8d86" : "#6f767c";
        const edge = brick.hp > 1 ? "#b0a793" : "#8fa0a7";
        const seam = brick.hp > 1 ? neon.cyan : neon.pink;
        ctx.fillStyle = base;
        roundRect(brick.x, brick.y, brick.w, brick.h, 6);
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(brick.x + 5, brick.y + 4, brick.w - 12, 3);
        ctx.fillStyle = edge;
        ctx.fillRect(brick.x + 5, brick.y + brick.h - 5, brick.w - 10, 3);

        const offset = (brick.row * 9 + brick.col * 13) % 17;
        ctx.strokeStyle = seam;
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 2;
        ctx.shadowColor = seam;
        ctx.shadowBlur = 5 + damage * 6;
        ctx.beginPath();
        ctx.moveTo(brick.x + 8 + offset, brick.y + 7);
        ctx.lineTo(brick.x + 22 + offset * 0.35, brick.y + brick.h - 8);
        ctx.lineTo(brick.x + brick.w - 11, brick.y + 11 + (offset % 6));
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;

        ctx.fillStyle = "rgba(5,8,22,0.22)";
        ctx.fillRect(brick.x + 10 + (offset % 9), brick.y + 10, 5, 4);
        ctx.fillRect(brick.x + brick.w - 19, brick.y + 8 + (offset % 8), 6, 5);

        if (damage > 0) {
          ctx.strokeStyle = "rgba(5,8,22,0.55)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(brick.x + brick.w * 0.22, brick.y + 5);
          ctx.lineTo(brick.x + brick.w * 0.34, brick.y + brick.h - 6);
          ctx.stroke();
        }
        return;
      }

      ctx.fillStyle = brick.hp > 1 ? "#f3d088" : brick.color;
      roundRect(brick.x, brick.y, brick.w, brick.h, 5);
      ctx.fillStyle = "rgba(255,255,255,0.16)";
      ctx.fillRect(brick.x + 6, brick.y + 5, brick.w - 12, 3);
    }

    function drawDriftmassPiece(piece, dropped = false) {
      const hpRatio = Math.max(0, piece.hp ?? 1) / Math.max(1, piece.maxHp ?? 1);
      const damage = 1 - hpRatio;
      const pulse = 0.5 + Math.sin(state.starTime * 6 + piece.dx * 0.02 + piece.dy * 0.04) * 0.5;
      ctx.save();
      ctx.translate(piece.x, piece.y);
      ctx.rotate(piece.spin || 0);

      if (!dropped && piece.active) {
        const aura = ctx.createRadialGradient(0, 0, piece.r * 0.2, 0, 0, piece.r * 1.75);
        aura.addColorStop(0, piece.core ? `rgba(223, 184, 91, ${0.24 + pulse * 0.16})` : `rgba(99, 230, 255, ${0.16 + pulse * 0.12})`);
        aura.addColorStop(1, "rgba(5, 8, 22, 0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, piece.r * 1.75, 0, Math.PI * 2);
        ctx.fill();
      }

      const gradient = ctx.createRadialGradient(-piece.r * 0.25, -piece.r * 0.35, 2, 0, 0, piece.r * 1.2);
      gradient.addColorStop(0, piece.core ? "#d7c48e" : "#9da3a6");
      gradient.addColorStop(0.6, piece.core ? "#796d55" : "#657177");
      gradient.addColorStop(1, "#303941");
      ctx.fillStyle = gradient;
      ctx.beginPath();
      for (let i = 0; i < 12; i += 1) {
        const angle = (Math.PI * 2 * i) / 12;
        const wobble = piece.r * (0.72 + seededNoise(i + piece.r + piece.x * 0.01) * 0.35);
        ctx.lineTo(Math.cos(angle) * wobble, Math.sin(angle) * wobble);
      }
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = piece.core ? "#dfb85b" : "#63e6ff";
      ctx.globalAlpha = piece.active === false && !dropped ? 0.15 : 0.55;
      ctx.lineWidth = piece.core ? 4 : 3;
      ctx.beginPath();
      ctx.moveTo(-piece.r * 0.48, -piece.r * 0.1);
      ctx.lineTo(-piece.r * 0.05, piece.r * 0.34);
      ctx.lineTo(piece.r * 0.46, -piece.r * 0.22);
      ctx.stroke();
      ctx.globalAlpha = 1;

      if (damage > 0.05) {
        ctx.strokeStyle = piece.core ? "#ffe3a1" : "#9cf3ff";
        ctx.globalAlpha = Math.min(0.86, 0.28 + damage * 0.7);
        ctx.lineWidth = 1.5 + damage * 1.2;
        for (let i = 0; i < 3; i += 1) {
          const angle = -0.8 + i * 0.7 + damage * 0.4;
          ctx.beginPath();
          ctx.moveTo(Math.cos(angle) * piece.r * 0.16, Math.sin(angle) * piece.r * 0.16);
          ctx.lineTo(Math.cos(angle + 0.24) * piece.r * (0.52 + damage * 0.12), Math.sin(angle + 0.24) * piece.r * (0.52 + damage * 0.12));
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      if (!dropped && piece.active) {
        ctx.fillStyle = "rgba(5,8,22,0.72)";
        ctx.fillRect(-piece.r * 0.58, piece.r + 8, piece.r * 1.16, 5);
        ctx.fillStyle = piece.core ? "#dfb85b" : "#63e6ff";
        ctx.fillRect(-piece.r * 0.58, piece.r + 8, piece.r * 1.16 * hpRatio, 5);
      }
      ctx.restore();
    }

    function drawBoss() {
      if (!state.boss) return;
      const phase = state.boss.phase;
      const activeShards = state.boss.pieces.filter((piece) => !piece.core && piece.active);
      const core = state.boss.pieces.find((piece) => piece.core);
      const pulse = 0.5 + Math.sin(phase * 5) * 0.5;

      ctx.save();
      ctx.strokeStyle = `rgba(99,230,255,${0.1 + pulse * 0.12})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(state.boss.x, state.boss.y + 10, 158, 118, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(223,184,91,0.12)";
      ctx.setLineDash([3, 12]);
      ctx.beginPath();
      ctx.ellipse(state.boss.x, state.boss.y + 10, 118 + pulse * 18, 84 + pulse * 12, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      if (core) {
        for (const piece of activeShards) {
          ctx.strokeStyle = `rgba(99,230,255,${0.18 + pulse * 0.18})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(piece.x, piece.y);
          ctx.lineTo(core.x || state.boss.x, core.y || state.boss.y + 8);
          ctx.stroke();
        }
      }
      ctx.restore();

      for (const piece of state.boss.pieces) {
        if (!piece.active) continue;
        if (piece.core && !state.boss.coreOpen) continue;
        drawDriftmassPiece(piece);
      }

      if (!state.boss.coreOpen) {
        ctx.save();
        ctx.strokeStyle = `rgba(223,184,91,${0.18 + pulse * 0.18})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(state.boss.x, state.boss.y + 8, 48 + pulse * 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "rgba(183,175,163,0.8)";
        ctx.font = "bold 13px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("OUTER SHARDS LOCK CORE", state.boss.x, state.boss.y + 128);
      }
    }

    function drawDroppedBossPieces() {
      for (const piece of state.droppedBossPieces) {
        drawDriftmassPiece(piece, true);
      }
    }

    function drawParticle(p) {
      const alpha = Math.max(0, p.life / (p.maxLife || 1));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.strokeStyle = p.color;

      if (p.shape === "chip") {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.spin);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size * 1.4, p.size);
        ctx.restore();
      } else if (p.shape === "mote") {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.8 + (1 - alpha) * 0.6), 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === "spark") {
        const length = p.size * 4;
        const mag = Math.max(1, Math.hypot(p.vx, p.vy));
        ctx.lineWidth = Math.max(1, p.size * 0.65);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - (p.vx / mag) * length, p.y - (p.vy / mag) * length);
        ctx.stroke();
      } else {
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      ctx.globalAlpha = 1;
    }

    function drawPulseTrail() {
      for (const trail of state.pulseTrail) {
        const alpha = Math.max(0, trail.life / (trail.impact ? 0.24 : 0.28));
        ctx.globalAlpha = alpha * (trail.impact ? 0.55 : 0.32);
        ctx.strokeStyle = trail.color;
        ctx.shadowColor = trail.color;
        ctx.shadowBlur = trail.impact ? 10 : 7;
        ctx.lineWidth = trail.impact ? 3 : 2;
        ctx.beginPath();
        ctx.arc(trail.x, trail.y, trail.impact ? trail.r * (1.4 - alpha) : trail.r * (1.2 + (1 - alpha)), 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    function drawPulseCore(time) {
      const pulse = 1 + Math.sin(time / 110) * 0.13;
      const glow = ctx.createRadialGradient(state.ball.x, state.ball.y, 2, state.ball.x, state.ball.y, 30);
      glow.addColorStop(0, "rgba(245, 239, 230, 0.96)");
      glow.addColorStop(0.28, "rgba(255, 92, 200, 0.28)");
      glow.addColorStop(0.5, "rgba(99, 230, 255, 0.86)");
      glow.addColorStop(1, "rgba(99, 230, 255, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(state.ball.x, state.ball.y, 30 * pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = neon.gold;
      ctx.shadowBlur = 10;
      ctx.fillStyle = "#f5dc7a";
      ctx.beginPath();
      ctx.arc(state.ball.x, state.ball.y, state.ball.r * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(state.ball.x - 3, state.ball.y - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPixelPose(ctxTarget, pose, x, y, scale, palette) {
      for (let row = 0; row < pose.length; row += 1) {
        for (let col = 0; col < pose[row].length; col += 1) {
          const value = pose[row][col];
          if (value === "0") continue;
          ctxTarget.fillStyle = palette[value];
          ctxTarget.fillRect(x + col * scale, y + row * scale, scale, scale);
        }
      }
    }

    function getFlurbMood() {
      if (state.won) return "bright";
      if (state.gameOver || state.mode === "gameover") return "dim";
      if (state.boss && state.mode === "playing") return "intense";
      if (state.launched) return "focused";
      return "calm";
    }

    function getFlurbPalette(mood, blend) {
      const palettes = {
        calm: { body: blend < 0.5 ? "#d85cff" : "#63e6ff", eyes: "#f6efe6", glow: "#63e6ff" },
        focused: { body: blend < 0.5 ? "#a86cff" : "#42d7ff", eyes: "#fff5c9", glow: "#63e6ff" },
        intense: { body: blend < 0.5 ? "#ff5cc8" : "#dfb85b", eyes: "#fff5c9", glow: "#dfb85b" },
        bright: { body: blend < 0.5 ? "#63e6ff" : "#83c27d", eyes: "#ffffff", glow: "#83c27d" },
        dim: { body: "#5f6b78", eyes: "#b7afa3", glow: "#5f6b78" }
      };
      return palettes[mood] || palettes.calm;
    }

    function getFlurbPose(time) {
      const frame = Math.floor(time / 260) % flurbPoses.length;
      const nextFrame = (frame + 1) % flurbPoses.length;
      const blend = (time % 260) / 260;
      const mood = getFlurbMood();
      return {
        pose: blend < 0.5 ? flurbPoses[frame] : flurbPoses[nextFrame],
        blend,
        mood,
        palette: getFlurbPalette(mood, blend)
      };
    }

    function drawFluxWisps(ctxTarget, x, y, scale, time, palette, intensity = 1) {
      ctxTarget.save();
      ctxTarget.fillStyle = palette.glow;
      for (let i = 0; i < 5; i += 1) {
        const angle = time / (260 + i * 25) + i * 1.7;
        const radius = scale * (7 + Math.sin(time / 300 + i) * 1.3) * intensity;
        const wx = x + scale * 4.5 + Math.cos(angle) * radius;
        const wy = y + scale * 3.5 + Math.sin(angle) * radius;
        ctxTarget.globalAlpha = 0.28 + (i % 2) * 0.12;
        ctxTarget.fillRect(wx, wy, Math.max(2, scale * 0.7), Math.max(2, scale * 0.7));
      }
      ctxTarget.restore();
      ctxTarget.globalAlpha = 1;
    }

    function drawPilotFlurb(time, shipX, shipY, shipW) {
      const { pose, palette } = getFlurbPose(time);
      const scale = 4;
      const bob = Math.sin(time / 180) * 2;
      const lean = (state.paddle.thrust || 0) * 3;
      const x = shipX + shipW / 2 - 18 + lean;
      const y = shipY - 30 + bob;

      drawFluxWisps(ctx, x, y, scale, time, palette, 0.7);

      ctx.fillStyle = "rgba(99, 230, 255, 0.22)";
      ctx.beginPath();
      ctx.ellipse(x + 18, y + 27, 25, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      drawPixelPose(ctx, pose, x, y, scale, {
        "1": "#151a22",
        "2": palette.eyes,
        "3": palette.body
      });

      ctx.fillStyle = "rgba(255,255,255,0.38)";
      ctx.fillRect(x + 5 * scale, y + 1 * scale, scale, scale);
    }

    function drawSkimmer(time) {
      const x = state.paddle.x;
      const y = state.paddle.y - 10;
      const w = state.paddle.w;
      const h = 26;
      const thrust = state.paddle.thrust || 0;
      const flicker = 5 + Math.sin(time / 48) * 3;

      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h + 7, w * 0.48, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.strokeStyle = "rgba(99, 230, 255, 0.38)";
      ctx.shadowColor = neon.cyan;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 18, y + 8);
      ctx.lineTo(x + w / 2, y - 1);
      ctx.lineTo(x + w - 18, y + 8);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#d8dce4";
      roundRect(x + 10, y + 8, w - 20, 14, 4);
      ctx.fillStyle = "#5f6b78";
      roundRect(x + 28, y + 2, w - 56, 18, 4);
      ctx.shadowColor = neon.cyan;
      ctx.shadowBlur = 9;
      ctx.fillStyle = neon.cyan;
      ctx.fillRect(x + w / 2 - 12, y + 7, 24, 5);
      ctx.shadowBlur = 0;
      ctx.fillStyle = neon.gold;
      ctx.fillRect(x + 14, y + 14, 12, 5);
      ctx.fillRect(x + w - 26, y + 14, 12, 5);

      ctx.fillStyle = "#2b3340";
      ctx.fillRect(x + 4, y + 15, 18, 9);
      ctx.fillRect(x + w - 22, y + 15, 18, 9);

      if (thrust !== 0) {
        const flameX = thrust < 0 ? x + w - 8 : x + 8;
        ctx.shadowColor = neon.cyan;
        ctx.shadowBlur = 13;
        ctx.fillStyle = neon.cyan;
        ctx.beginPath();
        ctx.moveTo(flameX, y + 19);
        ctx.lineTo(flameX + (thrust < 0 ? 1 : -1) * (18 + flicker), y + 14);
        ctx.lineTo(flameX + (thrust < 0 ? 1 : -1) * (18 + flicker), y + 25);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = neon.pink;
        ctx.fillRect(flameX + (thrust < 0 ? 1 : -1) * 9, y + 18, 8, 4);
        ctx.shadowBlur = 0;
      }

      drawPilotFlurb(time, x, y, w);
    }

    function drawFlurbBay(time, variant = "between") {
      const w = canvas.width;
      const h = canvas.height;
      const bayGradient = ctx.createLinearGradient(0, 0, 0, h);
      bayGradient.addColorStop(0, "#070b16");
      bayGradient.addColorStop(0.7, "#101733");
      bayGradient.addColorStop(1, "#180f2b");
      ctx.fillStyle = bayGradient;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = "rgba(245,239,230,0.5)";
      for (let i = 0; i < 58; i += 1) {
        const x = (seededNoise(i + 211) * w + state.starTime * (i % 3 + 1) * 5) % w;
        const y = seededNoise(i + 317) * h;
        ctx.fillRect(x, y, i % 4 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
      }

      ctx.fillStyle = "rgba(99,230,255,0.10)";
      roundRect(72, 58, 656, 350, 8);
      ctx.strokeStyle = "rgba(99,230,255,0.42)";
      ctx.lineWidth = 2;
      ctx.strokeRect(72, 58, 656, 350);
      ctx.beginPath();
      ctx.roundRect(82, 68, 636, 330, 8);
      neonStroke(neon.pink, 16, 0.16);

      const dockX = 208;
      const dockY = 284;
      ctx.fillStyle = "rgba(99,230,255,0.12)";
      ctx.fillRect(132, dockY + 54, 536, 2);
      ctx.fillStyle = "#2b3340";
      ctx.fillRect(dockX, dockY + 42, 384, 24);
      ctx.fillStyle = "#5f6b78";
      ctx.fillRect(dockX + 32, dockY + 10, 320, 44);
      ctx.fillStyle = "#d8dce4";
      ctx.fillRect(dockX + 72, dockY, 240, 36);
      ctx.shadowColor = neon.cyan;
      ctx.shadowBlur = 8;
      ctx.fillStyle = neon.cyan;
      ctx.fillRect(dockX + 164, dockY + 11, 62, 8);
      ctx.shadowBlur = 0;
      ctx.fillStyle = neon.gold;
      ctx.fillRect(dockX + 58, dockY + 45, 34, 10);
      ctx.fillRect(dockX + 292, dockY + 45, 34, 10);

      const { pose, palette, mood } = getFlurbPose(time);
      const bounce = Math.sin(time / 180) * 4;
      const scale = 13;
      const x = 342;
      const y = 130 + bounce;
      drawFluxWisps(ctx, x, y, scale, time, palette, mood === "intense" ? 1.25 : 1);
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(x + 58, y + 110, 80, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      drawPixelPose(ctx, pose, x, y, scale, {
        "1": "#151a22",
        "2": palette.eyes,
        "3": palette.body
      });

      ctx.fillStyle = "#f5efe6";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 42px Segoe UI";
      ctx.fillText(variant === "pause" ? "PAUSED IN FLURB BAY" : "FLURB BAY", canvas.width / 2, 105);
      ctx.fillStyle = "#63e6ff";
      ctx.font = "bold 17px Segoe UI";
      const nextLevelName = levels[state.stageIndex + 1]?.name || "route clear";
      ctx.fillText(
        variant === "pause" ? `${currentZone.name.toUpperCase()} ${state.stageIndex + 1}: ${currentLevel().name}` : `NEXT: ${nextLevelName}`,
        canvas.width / 2,
        424
      );
      ctx.fillStyle = "#b7afa3";
      ctx.font = "15px Segoe UI";
      ctx.fillText("Skimmer systems nominal / Pulse Core stable", canvas.width / 2, 452);
      ctx.fillStyle = "#dfb85b";
      ctx.font = "bold 16px Segoe UI";
      ctx.fillText(variant === "pause" ? "PRESS P TO RESUME" : "PRESS SPACE TO CONTINUE", canvas.width / 2, 478);
    }

    function draw(time) {
      drawBackground();
      if (state.mode === "splash") {
        drawSplashScreen(time);
        return;
      }
      if (state.mode === "bay") {
        drawFlurbBay(time);
        return;
      }

      for (const brick of state.bricks) {
        drawBrick(brick);
      }

      drawBoss();
      drawDroppedBossPieces();

      for (const powerup of state.powerups) {
        const powerupColor = powerup.type === "wide" ? neon.cyan : neon.green;
        ctx.shadowColor = powerupColor;
        ctx.shadowBlur = 12;
        ctx.fillStyle = powerupColor;
        roundRect(powerup.x, powerup.y, powerup.w, powerup.h, 4);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#101317";
        ctx.font = "bold 12px Segoe UI";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(powerup.type === "wide" ? "W" : "+", powerup.x + powerup.w / 2, powerup.y + powerup.h / 2);
      }

      for (const p of state.particles) {
        drawParticle(p);
      }

      drawPulseTrail();
      drawSkimmer(time);
      drawPulseCore(time);

      if (!state.launched && !state.gameOver && !state.won) drawOverlay("Ready", "Press Space to launch");
      if (state.paused) drawFlurbBay(time, "pause");
      if (state.gameOver) drawOverlay("Game Over", "Press R to restart");
      if (state.won) drawOverlay("Zone Clear", "Driftmass signal cracked");
    }

    function drawSplashScreen(time) {
      ctx.fillStyle = "rgba(5, 8, 22, 0.42)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(99, 230, 255, 0.1)";
      roundRect(78, 54, 644, 382, 8);
      ctx.strokeStyle = "rgba(99, 230, 255, 0.45)";
      ctx.lineWidth = 2;
      ctx.strokeRect(78, 54, 644, 382);

      const signalPulse = 0.5 + Math.sin(time / 260) * 0.5;
      ctx.strokeStyle = `rgba(223, 184, 91, ${0.16 + signalPulse * 0.18})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(canvas.width / 2, 220, 126 + signalPulse * 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(canvas.width / 2, 220, 168 + signalPulse * 18, 0, Math.PI * 2);
      ctx.stroke();

      const { pose, palette } = getFlurbPose(time);
      const scale = 12;
      const x = 352;
      const y = 138 + Math.sin(time / 220) * 5;
      drawFluxWisps(ctx, x, y, scale, time, palette, 1.15);
      ctx.fillStyle = "rgba(0,0,0,0.34)";
      ctx.beginPath();
      ctx.ellipse(x + 54, y + 96, 72, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      drawPixelPose(ctx, pose, x, y, scale, {
        "1": "#151a22",
        "2": palette.eyes,
        "3": palette.body
      });

      ctx.fillStyle = "#f5efe6";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 48px Segoe UI";
      ctx.fillText("FLURBY", canvas.width / 2, 92);

      ctx.font = "bold 18px Segoe UI";
      ctx.fillStyle = "#63e6ff";
      ctx.fillText("SPECIES SIGNAL: FLUXMORPH", canvas.width / 2, 286);

      ctx.font = "15px Segoe UI";
      ctx.fillStyle = "#b7afa3";
      ctx.fillText("a tiny traveler wakes in unknown space", canvas.width / 2, 314);
      ctx.fillText("the stars remember shapes she has not become", canvas.width / 2, 338);
      ctx.fillText("first echo: Driftmass Signal / origin uncertain", canvas.width / 2, 362);

      ctx.fillStyle = `rgba(223, 184, 91, ${0.55 + signalPulse * 0.35})`;
      ctx.font = "bold 18px Segoe UI";
      ctx.fillText("PRESS SPACE TO FOLLOW THE FIRST ECHO", canvas.width / 2, 406);
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = "rgba(16, 19, 23, 0.64)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f5efe6";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 44px Segoe UI";
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 18);
      ctx.fillStyle = "#b7afa3";
      ctx.font = "18px Segoe UI";
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 26);
    }

    function updateUi() {
      scoreLabel.textContent = `${state.score} pts`;
      stageLabel.textContent = `1-${state.stageIndex + 1}`;
      livesLabel.textContent = state.lives;
      bricksLabel.textContent = state.bricks.length;
      comboLabel.textContent = `x${state.combo}`;
      startButton.textContent = state.mode === "splash" ? "Begin Signal" : state.paused ? "Resume" : state.launched ? "Pulse In Flight" : "Launch Pulse";
      startButton.disabled = state.mode !== "splash" && state.launched && !state.paused;
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw(now);
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowleft", "arrowright", "w", "a", "s", "d", " ", "p", "r"].includes(key)) event.preventDefault();
      unlockAudio();
      if (key === " ") launch();
      else if (key === "p") {
        if (!state.gameOver && !state.won) {
          state.paused = !state.paused;
          playSound("pause");
          setMessage(state.paused ? "Paused." : "Back in motion.");
        }
      } else if (key === "r") restartGame();
      else keys.add(key);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    startButton.addEventListener("click", () => {
      unlockAudio();
      launch();
    });
    soundButton.addEventListener("click", testSound);
    restartButton.addEventListener("click", () => {
      unlockAudio();
      restartGame();
    });

    restartGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
