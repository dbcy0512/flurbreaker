<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flurbreaker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101317;
      --panel: #1b222b;
      --panel-2: #242d38;
      --text: #f5efe6;
      --muted: #b7afa3;
      --line: #3a4654;
      --gold: #dfb85b;
      --green: #83c27d;
      --blue: #86acd9;
      --rose: #d67f7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(223, 184, 91, 0.14), transparent 34%),
        linear-gradient(225deg, rgba(134, 172, 217, 0.13), transparent 38%),
        linear-gradient(0deg, rgba(131, 194, 125, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .shell {
      width: min(1120px, calc(100vw - 28px));
      display: grid;
      grid-template-columns: minmax(0, 800px) 280px;
      gap: 16px;
      align-items: start;
    }

    main,
    aside {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 34, 43, 0.94);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
    }

    main {
      padding: 14px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding: 4px 2px 12px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1;
    }

    .subtitle,
    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .score {
      min-width: 150px;
      text-align: right;
      color: var(--gold);
      font-weight: 700;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111820;
    }

    aside {
      padding: 16px;
    }

    section + section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat {
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 10px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      min-height: 42px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--gold);
    }

    .message {
      min-height: 48px;
      color: var(--muted);
      line-height: 1.45;
    }

    .flurb-bay {
      display: grid;
      gap: 10px;
    }

    .flurb-canvas {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #070b16;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .resource-pill {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 6px 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .resource-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--gold);
    }

    .resource-count {
      color: var(--text);
      font-weight: 700;
    }

    @media (max-width: 920px) {
      body {
        display: block;
        padding: 14px 0;
      }

      .shell {
        grid-template-columns: 1fr;
        width: min(800px, calc(100vw - 24px));
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <header>
        <div>
          <h1>Flurbreaker</h1>
          <div class="subtitle">Guide Flurb through asteroid space.</div>
        </div>
        <div class="score" id="scoreLabel">0 pts</div>
      </header>
      <canvas id="game" width="800" height="500" aria-label="Flurbreaker brick breaker game"></canvas>
    </main>

    <aside>
      <section class="flurb-bay">
        <h2>Flurb Bay</h2>
        <canvas class="flurb-canvas" id="flurbBay" width="248" height="186" aria-label="Flurb showcase and starter ship"></canvas>
        <div class="resource-grid">
          <div class="resource-pill"><span class="resource-dot" style="background:#63e6ff"></span><span>Water</span><strong class="resource-count" id="waterCount">0</strong></div>
          <div class="resource-pill"><span class="resource-dot" style="background:#c2cad4"></span><span>Iron</span><strong class="resource-count" id="ironCount">0</strong></div>
          <div class="resource-pill"><span class="resource-dot" style="background:#e8dcff"></span><span>Platinum</span><strong class="resource-count" id="platinumCount">0</strong></div>
        </div>
      </section>

      <section>
        <h2>Status</h2>
        <div class="stat-grid">
          <div class="stat"><strong id="stageLabel">1</strong><span>Stage</span></div>
          <div class="stat"><strong id="livesLabel">3</strong><span>Lives</span></div>
          <div class="stat"><strong id="bricksLabel">0</strong><span>Bricks</span></div>
          <div class="stat"><strong id="comboLabel">x1</strong><span>Combo</span></div>
        </div>
      </section>

      <section>
        <h2>Controls</h2>
        <div class="controls">
          <span>Move: WASD, currently A/D</span>
          <span>Launch: Space</span>
          <span>Pause: P</span>
          <span>Restart: R</span>
        </div>
        <button id="startButton" type="button">Launch Pulse</button>
        <button id="restartButton" type="button">Restart Game</button>
      </section>

      <section>
        <h2>Console</h2>
        <div class="message" id="message">Press Space to launch. A/D to move.</div>
      </section>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const flurbBay = document.getElementById("flurbBay");
    const fctx = flurbBay.getContext("2d");
    const scoreLabel = document.getElementById("scoreLabel");
    const stageLabel = document.getElementById("stageLabel");
    const livesLabel = document.getElementById("livesLabel");
    const bricksLabel = document.getElementById("bricksLabel");
    const comboLabel = document.getElementById("comboLabel");
    const waterCount = document.getElementById("waterCount");
    const ironCount = document.getElementById("ironCount");
    const platinumCount = document.getElementById("platinumCount");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const restartButton = document.getElementById("restartButton");

    const colors = ["#dfb85b", "#83c27d", "#86acd9", "#d67f7a", "#b58ce0"];
    const keys = new Set();
    const stages = [
      {
        name: "Warm Boot",
        ballSpeed: 270,
        paddleWidth: 120,
        asteroidEvery: 1.55,
        asteroidSpeed: 185,
        layout: [
          "..........",
          "..111111..",
          ".12222221.",
          "..111111.."
        ]
      },
      {
        name: "Pixel Gate",
        ballSpeed: 302,
        paddleWidth: 112,
        asteroidEvery: 1.3,
        asteroidSpeed: 220,
        layout: [
          "11..22..11",
          ".13333331.",
          "..222222..",
          ".13333331.",
          "11..22..11"
        ]
      },
      {
        name: "Neon Stack",
        ballSpeed: 334,
        paddleWidth: 104,
        asteroidEvery: 1.08,
        asteroidSpeed: 255,
        layout: [
          "4444444444",
          ".333..333.",
          "..222222..",
          ".333..333.",
          "1111111111",
          "..2.44.2.."
        ]
      }
    ];

    const resources = {
      water: { label: "Water", short: "H2O", color: "#63e6ff" },
      iron: { label: "Iron", short: "Fe", color: "#c2cad4" },
      platinum: { label: "Platinum", short: "Pt", color: "#e8dcff" }
    };

    const resourceTypes = Object.keys(resources);
    const starLayers = [
      { speed: 16, size: 1, alpha: 0.42, stars: makeStars(60, 11) },
      { speed: 34, size: 1.6, alpha: 0.62, stars: makeStars(38, 29) },
      { speed: 62, size: 2.3, alpha: 0.88, stars: makeStars(22, 47) }
    ];

    const state = {
      stageIndex: 0,
      score: 0,
      lives: 3,
      combo: 1,
      running: true,
      launched: false,
      paused: false,
      gameOver: false,
      won: false,
      paddle: { x: 340, y: 456, w: 120, h: 14, speed: 560 },
      ball: { x: 400, y: 434, r: 8, vx: 230, vy: -260 },
      bricks: [],
      particles: [],
      pulseTrail: [],
      powerups: [],
      asteroids: [],
      resources: { water: 0, iron: 0, platinum: 0 },
      asteroidTimer: 0,
      starTime: 0
    };

    const blobPoses = [
      [
        "000111000",
        "001333100",
        "013333310",
        "133232331",
        "133333331",
        "013333310",
        "001111100"
      ],
      [
        "000111100",
        "001333310",
        "013333331",
        "133223331",
        "133333310",
        "011333100",
        "000111000"
      ],
      [
        "001111000",
        "013333100",
        "133333310",
        "133322331",
        "013333331",
        "001333100",
        "000111000"
      ]
    ];

    function seededNoise(seed) {
      const value = Math.sin(seed * 999.97) * 10000;
      return value - Math.floor(value);
    }

    function makeStars(count, offset) {
      const stars = [];
      for (let i = 0; i < count; i += 1) {
        stars.push({
          x: seededNoise(i + offset) * canvas.width,
          y: seededNoise(i * 2 + offset) * canvas.height
        });
      }
      return stars;
    }

    function resetBall() {
      state.launched = false;
      state.combo = 1;
      state.ball.x = state.paddle.x + state.paddle.w / 2;
      state.ball.y = state.paddle.y - 18;
      const stage = currentStage();
      const speed = stage.ballSpeed;
      state.ball.vx = (Math.random() > 0.5 ? 1 : -1) * (150 + state.stageIndex * 28);
      state.ball.vy = -speed;
      state.pulseTrail = [];
      setMessage("Pulse Core ready. Launch when you are.");
    }

    function currentStage() {
      return stages[state.stageIndex];
    }

    function makeStage(stageIndex) {
      state.bricks = [];
      state.powerups = [];
      state.particles = [];
      state.pulseTrail = [];
      state.asteroids = [];
      state.asteroidTimer = 0.65;
      const stage = stages[stageIndex];
      const cols = 10;
      const gap = 8;
      const brickW = (canvas.width - 80 - gap * (cols - 1)) / cols;
      const brickH = 24;
      state.paddle.w = stage.paddleWidth;
      state.paddle.x = canvas.width / 2 - state.paddle.w / 2;

      for (let row = 0; row < stage.layout.length; row += 1) {
        const line = stage.layout[row].padEnd(cols, ".");
        for (let col = 0; col < cols; col += 1) {
          const cell = line[col];
          if (cell === ".") continue;
          const hp = Number(cell);
          state.bricks.push({
            x: 40 + col * (brickW + gap),
            y: 58 + row * (brickH + gap),
            w: brickW,
            h: brickH,
            hp,
            maxHp: hp,
            color: colors[(hp + row + col) % colors.length]
          });
        }
      }
      resetBall();
      updateUi();
    }

    function setMessage(text) {
      message.textContent = text;
    }

    function launch() {
      if (state.gameOver || state.won) return;
      if (state.paused) {
        state.paused = false;
        setMessage("Back in motion.");
      }
      if (!state.launched) {
        state.launched = true;
        setMessage("Clear the board.");
      }
    }

    function restartGame() {
      state.stageIndex = 0;
      state.score = 0;
      state.lives = 3;
      state.combo = 1;
      state.resources = { water: 0, iron: 0, platinum: 0 };
      state.asteroids = [];
      state.asteroidTimer = 0;
      state.starTime = 0;
      state.gameOver = false;
      state.won = false;
      state.paused = false;
      makeStage(0);
      setMessage("Fresh board. Press Space to launch.");
    }

    function nextStage() {
      state.stageIndex += 1;
      if (state.stageIndex >= stages.length) {
        state.won = true;
        state.launched = false;
        setMessage("You cleared every stage. Flurb has a clear route through space.");
        updateUi();
        return;
      }
      makeStage(state.stageIndex);
      setMessage(`Stage ${state.stageIndex + 1}: ${currentStage().name}.`);
    }

    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 70 + Math.random() * 160;
      state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.45 + Math.random() * 0.35,
          color
        });
      }
    }

    function maybePowerup(x, y) {
      if (Math.random() > 0.12) return;
      state.powerups.push({
        x,
        y,
        w: 22,
        h: 16,
        vy: 105,
        type: Math.random() > 0.5 ? "wide" : "life"
      });
    }

    function spawnImpactBurst(x, y, color, count = 14) {
      spawnParticles(x, y, color, count);
      state.pulseTrail.push({ x, y, life: 0.24, r: 18, impact: true, color });
    }

    function spawnAsteroid() {
      const stage = currentStage();
      const type = resourceTypes[Math.floor(Math.random() * resourceTypes.length)];
      const radius = 13 + Math.random() * 9;
      state.asteroids.push({
        x: 36 + Math.random() * (canvas.width - 72),
        y: -radius - 8,
        r: radius,
        vy: stage.asteroidSpeed + Math.random() * 55,
        spin: Math.random() * Math.PI * 2,
        spinSpeed: (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 1.4),
        type
      });
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function circleRectCollision(circle, rect) {
      const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
      const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
      const dx = circle.x - cx;
      const dy = circle.y - cy;
      return dx * dx + dy * dy <= circle.r * circle.r;
    }

    function collectAsteroid(asteroid) {
      state.resources[asteroid.type] += 1;
      state.score += 15;
      spawnParticles(asteroid.x, asteroid.y, resources[asteroid.type].color, 14);
      setMessage(`Flurb collected ${resources[asteroid.type].label.toLowerCase()}.`);
    }

    function update(dt) {
      if (state.paused || state.gameOver || state.won) return;
      state.starTime += dt;

      const movingLeft = keys.has("arrowleft") || keys.has("a");
      const movingRight = keys.has("arrowright") || keys.has("d");
      state.paddle.thrust = movingLeft ? -1 : movingRight ? 1 : 0;
      if (movingLeft) state.paddle.x -= state.paddle.speed * dt;
      if (movingRight) state.paddle.x += state.paddle.speed * dt;
      state.paddle.x = Math.max(16, Math.min(canvas.width - state.paddle.w - 16, state.paddle.x));

      if (!state.launched) {
        state.ball.x = state.paddle.x + state.paddle.w / 2;
        state.ball.y = state.paddle.y - 18;
      } else {
        state.ball.x += state.ball.vx * dt;
        state.ball.y += state.ball.vy * dt;

        if (state.ball.x < state.ball.r) {
          state.ball.x = state.ball.r;
          state.ball.vx *= -1;
        }
        if (state.ball.x > canvas.width - state.ball.r) {
          state.ball.x = canvas.width - state.ball.r;
          state.ball.vx *= -1;
        }
        if (state.ball.y < state.ball.r) {
          state.ball.y = state.ball.r;
          state.ball.vy *= -1;
        }

        if (circleRectCollision(state.ball, state.paddle) && state.ball.vy > 0) {
          const hit = (state.ball.x - (state.paddle.x + state.paddle.w / 2)) / (state.paddle.w / 2);
          const speed = Math.hypot(state.ball.vx, state.ball.vy) + 4;
          state.ball.vx = hit * speed * 0.82;
          state.ball.vy = -Math.max(250, speed * (1 - Math.abs(hit) * 0.16));
          state.ball.y = state.paddle.y - state.ball.r - 1;
          state.combo = 1;
          spawnImpactBurst(state.ball.x, state.ball.y, "#63e6ff", 10);
        }

        for (let i = state.bricks.length - 1; i >= 0; i -= 1) {
          const brick = state.bricks[i];
          if (!circleRectCollision(state.ball, brick)) continue;

          brick.hp -= 1;
          state.ball.vy *= -1;
          state.score += 10 * state.combo;
          state.combo = Math.min(9, state.combo + 1);
          spawnImpactBurst(state.ball.x, state.ball.y, brick.color, 8);

          if (brick.hp <= 0) {
            state.bricks.splice(i, 1);
            state.score += 20;
            maybePowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
          }
          break;
        }

        if (state.ball.y > canvas.height + 30) {
          state.lives -= 1;
          if (state.lives <= 0) {
            state.gameOver = true;
            setMessage("Game over. Press R or Restart Game.");
          } else {
            resetBall();
          }
        }
      }

      for (let i = state.powerups.length - 1; i >= 0; i -= 1) {
        const powerup = state.powerups[i];
        powerup.y += powerup.vy * dt;
        if (rectsOverlap(powerup, state.paddle)) {
          if (powerup.type === "wide") {
            state.paddle.w = Math.min(170, state.paddle.w + 24);
            setMessage("Paddle widened. A small mercy.");
          } else {
            state.lives += 1;
            setMessage("Extra life. Flurb found backup courage.");
          }
          state.powerups.splice(i, 1);
        } else if (powerup.y > canvas.height + 20) {
          state.powerups.splice(i, 1);
        }
      }

      state.asteroidTimer -= dt;
      if (state.asteroidTimer <= 0) {
        spawnAsteroid();
        state.asteroidTimer = currentStage().asteroidEvery * (0.82 + Math.random() * 0.36);
      }

      for (let i = state.asteroids.length - 1; i >= 0; i -= 1) {
        const asteroid = state.asteroids[i];
        asteroid.y += asteroid.vy * dt;
        asteroid.spin += asteroid.spinSpeed * dt;
        if (circleRectCollision(asteroid, state.paddle)) {
          collectAsteroid(asteroid);
          state.asteroids.splice(i, 1);
        } else if (asteroid.y - asteroid.r > canvas.height + 20) {
          state.asteroids.splice(i, 1);
        }
      }

      for (let i = state.particles.length - 1; i >= 0; i -= 1) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 180 * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      if (state.launched) {
        state.pulseTrail.push({
          x: state.ball.x,
          y: state.ball.y,
          life: 0.28,
          r: state.ball.r,
          impact: false,
          color: "#63e6ff"
        });
      }
      for (let i = state.pulseTrail.length - 1; i >= 0; i -= 1) {
        const trail = state.pulseTrail[i];
        trail.life -= dt;
        if (trail.life <= 0) state.pulseTrail.splice(i, 1);
      }

      if (state.bricks.length === 0 && !state.gameOver) nextStage();
      updateUi();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#050816");
      gradient.addColorStop(0.55, "#101733");
      gradient.addColorStop(1, "#1b1230");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const layer of starLayers) {
        ctx.fillStyle = `rgba(245, 239, 230, ${layer.alpha})`;
        for (const star of layer.stars) {
          const y = (star.y + state.starTime * layer.speed) % canvas.height;
          ctx.fillRect(star.x, y, layer.size, layer.size);
        }
      }

      ctx.strokeStyle = "rgba(99, 230, 255, 0.08)";
      ctx.lineWidth = 1;
      for (let y = (state.starTime * 90) % 64; y < canvas.height; y += 64) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y + 18);
        ctx.stroke();
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function drawAsteroid(asteroid) {
      const material = resources[asteroid.type];
      ctx.save();
      ctx.translate(asteroid.x, asteroid.y);
      ctx.rotate(asteroid.spin);
      ctx.fillStyle = "#5d6470";
      ctx.beginPath();
      for (let i = 0; i < 9; i += 1) {
        const angle = (Math.PI * 2 * i) / 9;
        const wobble = asteroid.r * (0.74 + seededNoise(i + asteroid.r) * 0.38);
        ctx.lineTo(Math.cos(angle) * wobble, Math.sin(angle) * wobble);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = material.color;
      ctx.fillRect(-4, -4, 8, 8);
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.fillRect(-asteroid.r * 0.4, -asteroid.r * 0.45, 5, 5);
      ctx.restore();
    }

    function drawPulseTrail() {
      for (const trail of state.pulseTrail) {
        const alpha = Math.max(0, trail.life / (trail.impact ? 0.24 : 0.28));
        ctx.globalAlpha = alpha * (trail.impact ? 0.55 : 0.32);
        ctx.strokeStyle = trail.color;
        ctx.lineWidth = trail.impact ? 3 : 2;
        ctx.beginPath();
        ctx.arc(trail.x, trail.y, trail.impact ? trail.r * (1.4 - alpha) : trail.r * (1.2 + (1 - alpha)), 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function drawPulseCore(time) {
      const pulse = 1 + Math.sin(time / 110) * 0.13;
      const glow = ctx.createRadialGradient(state.ball.x, state.ball.y, 2, state.ball.x, state.ball.y, 30);
      glow.addColorStop(0, "rgba(245, 239, 230, 0.96)");
      glow.addColorStop(0.35, "rgba(99, 230, 255, 0.86)");
      glow.addColorStop(1, "rgba(99, 230, 255, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(state.ball.x, state.ball.y, 30 * pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f5dc7a";
      ctx.beginPath();
      ctx.arc(state.ball.x, state.ball.y, state.ball.r * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(state.ball.x - 3, state.ball.y - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawResourceSkimmer(time) {
      const x = state.paddle.x;
      const y = state.paddle.y - 10;
      const w = state.paddle.w;
      const h = 26;
      const thrust = state.paddle.thrust || 0;
      const flicker = 5 + Math.sin(time / 48) * 3;

      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h + 7, w * 0.48, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#d8dce4";
      roundRect(x + 10, y + 8, w - 20, 14, 4);
      ctx.fillStyle = "#5f6b78";
      roundRect(x + 28, y + 2, w - 56, 18, 4);
      ctx.fillStyle = "#63e6ff";
      ctx.fillRect(x + w / 2 - 12, y + 7, 24, 5);
      ctx.fillStyle = "#dfb85b";
      ctx.fillRect(x + 14, y + 14, 12, 5);
      ctx.fillRect(x + w - 26, y + 14, 12, 5);

      ctx.fillStyle = "#2b3340";
      ctx.fillRect(x + 4, y + 15, 18, 9);
      ctx.fillRect(x + w - 22, y + 15, 18, 9);

      if (thrust !== 0) {
        const flameX = thrust < 0 ? x + w - 8 : x + 8;
        ctx.fillStyle = "#63e6ff";
        ctx.beginPath();
        ctx.moveTo(flameX, y + 19);
        ctx.lineTo(flameX + (thrust < 0 ? 1 : -1) * (18 + flicker), y + 14);
        ctx.lineTo(flameX + (thrust < 0 ? 1 : -1) * (18 + flicker), y + 25);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#d85cff";
        ctx.fillRect(flameX + (thrust < 0 ? 1 : -1) * 9, y + 18, 8, 4);
      }
    }

    function drawBayPixel(ctxTarget, pose, x, y, scale, palette) {
      for (let row = 0; row < pose.length; row += 1) {
        for (let col = 0; col < pose[row].length; col += 1) {
          const value = pose[row][col];
          if (value === "0") continue;
          ctxTarget.fillStyle = palette[value];
          ctxTarget.fillRect(x + col * scale, y + row * scale, scale, scale);
        }
      }
    }

    function drawFlurbBay(time) {
      const w = flurbBay.width;
      const h = flurbBay.height;
      const bayGradient = fctx.createLinearGradient(0, 0, 0, h);
      bayGradient.addColorStop(0, "#070b16");
      bayGradient.addColorStop(0.7, "#101733");
      bayGradient.addColorStop(1, "#180f2b");
      fctx.fillStyle = bayGradient;
      fctx.fillRect(0, 0, w, h);

      fctx.fillStyle = "rgba(245,239,230,0.5)";
      for (let i = 0; i < 28; i += 1) {
        const x = (seededNoise(i + 211) * w + state.starTime * (i % 3 + 1) * 5) % w;
        const y = seededNoise(i + 317) * h;
        fctx.fillRect(x, y, i % 4 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
      }

      const dockX = 22;
      const dockY = 126;
      fctx.fillStyle = "rgba(99,230,255,0.12)";
      fctx.fillRect(0, dockY + 27, w, 1);
      fctx.fillStyle = "#2b3340";
      fctx.fillRect(dockX, dockY + 21, 190, 12);
      fctx.fillStyle = "#5f6b78";
      fctx.fillRect(dockX + 16, dockY + 5, 158, 22);
      fctx.fillStyle = "#d8dce4";
      fctx.fillRect(dockX + 36, dockY, 118, 18);
      fctx.fillStyle = "#63e6ff";
      fctx.fillRect(dockX + 82, dockY + 5, 30, 5);
      fctx.fillStyle = "#dfb85b";
      fctx.fillRect(dockX + 28, dockY + 22, 18, 5);
      fctx.fillRect(dockX + 146, dockY + 22, 18, 5);

      const frame = Math.floor(time / 260) % blobPoses.length;
      const nextFrame = (frame + 1) % blobPoses.length;
      const blend = (time % 260) / 260;
      const pose = blend < 0.5 ? blobPoses[frame] : blobPoses[nextFrame];
      const bounce = Math.sin(time / 180) * 4;
      const scale = 8;
      const x = 86;
      const y = 38 + bounce;
      fctx.fillStyle = "rgba(0,0,0,0.3)";
      fctx.beginPath();
      fctx.ellipse(x + 36, y + 67, 44, 10, 0, 0, Math.PI * 2);
      fctx.fill();
      drawBayPixel(fctx, pose, x, y, scale, {
        "1": "#151a22",
        "2": "#f6efe6",
        "3": blend < 0.5 ? "#d85cff" : "#63e6ff"
      });

      fctx.fillStyle = "#f5efe6";
      fctx.font = "bold 11px Segoe UI";
      fctx.textAlign = "left";
      fctx.fillText("FLURB", 14, 18);
      fctx.fillStyle = "#b7afa3";
      fctx.font = "10px Segoe UI";
      fctx.fillText("starter ship: skimmer shell", 14, 32);
    }

    function draw(time) {
      drawBackground();

      for (const brick of state.bricks) {
        ctx.fillStyle = brick.hp > 1 ? "#f3d088" : brick.color;
        roundRect(brick.x, brick.y, brick.w, brick.h, 5);
        ctx.fillStyle = "rgba(255,255,255,0.16)";
        ctx.fillRect(brick.x + 6, brick.y + 5, brick.w - 12, 3);
      }

      for (const powerup of state.powerups) {
        ctx.fillStyle = powerup.type === "wide" ? "#86acd9" : "#83c27d";
        roundRect(powerup.x, powerup.y, powerup.w, powerup.h, 4);
        ctx.fillStyle = "#101317";
        ctx.font = "bold 12px Segoe UI";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(powerup.type === "wide" ? "W" : "+", powerup.x + powerup.w / 2, powerup.y + powerup.h / 2);
      }

      for (const asteroid of state.asteroids) {
        drawAsteroid(asteroid);
      }

      for (const p of state.particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      }

      drawPulseTrail();
      drawResourceSkimmer(time);
      drawPulseCore(time);

      if (!state.launched && !state.gameOver && !state.won) drawOverlay("Ready", "Press Space to launch");
      if (state.paused) drawOverlay("Paused", "Press P to resume");
      if (state.gameOver) drawOverlay("Game Over", "Press R to restart");
      if (state.won) drawOverlay("Cleared", "Every board is clean");
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = "rgba(16, 19, 23, 0.64)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f5efe6";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 44px Segoe UI";
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 18);
      ctx.fillStyle = "#b7afa3";
      ctx.font = "18px Segoe UI";
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 26);
    }

    function updateUi() {
      scoreLabel.textContent = `${state.score} pts`;
      stageLabel.textContent = `${state.stageIndex + 1}`;
      livesLabel.textContent = state.lives;
      bricksLabel.textContent = state.bricks.length;
      comboLabel.textContent = `x${state.combo}`;
      waterCount.textContent = state.resources.water;
      ironCount.textContent = state.resources.iron;
      platinumCount.textContent = state.resources.platinum;
      startButton.textContent = state.paused ? "Resume" : state.launched ? "Pulse In Flight" : "Launch Pulse";
      startButton.disabled = state.launched && !state.paused;
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw(now);
      drawFlurbBay(now);
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowleft", "arrowright", "w", "a", "s", "d", " ", "p", "r"].includes(key)) event.preventDefault();
      if (key === " ") launch();
      else if (key === "p") {
        if (!state.gameOver && !state.won) {
          state.paused = !state.paused;
          setMessage(state.paused ? "Paused." : "Back in motion.");
        }
      } else if (key === "r") restartGame();
      else keys.add(key);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    startButton.addEventListener("click", launch);
    restartButton.addEventListener("click", restartGame);

    restartGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
